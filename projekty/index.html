<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocena finansowa projektów</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F4;--sf:#fff;--ink:#12263A;--mu:#566878;--ln:#D3DCE2;--ac:#1D5C87;--hl:#E3EEF5;--bad:#B3392F;--ok:#1E7F5C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A26;--sf:#16263A;--ink:#E4ECF3;--mu:#9AABBA;--ln:#27394D;--ac:#6FB0DB;--hl:#1D3550;--bad:#F0786C;--ok:#4CC596;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A26;--sf:#16263A;--ink:#E4ECF3;--mu:#9AABBA;--ln:#27394D;--ac:#6FB0DB;--hl:#1D3550;--bad:#F0786C;--ok:#4CC596;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 2px}
.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.lay{display:grid;grid-template-columns:minmax(290px,340px) minmax(0,1fr);gap:20px;align-items:start}
.lay>*{min-width:0}
@media(max-width:960px){.lay{grid-template-columns:minmax(0,1fr)}}
.pn{background:var(--sf);border:1px solid var(--ln);padding:16px;min-width:0}
.in{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:960px){.in{position:static;max-height:none}}
.in h2{font-size:15px;margin:0 0 12px;font-weight:600}
.in h2:not(:first-child){margin-top:20px;padding-top:14px;border-top:1px solid var(--ln)}
.fld{margin-bottom:14px}
label,.lb{display:block;font-size:13px;color:var(--mu);margin-bottom:4px;font-weight:500}
.seg{display:flex;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:7px 6px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ac);color:#fff;font-weight:600}
.ctl{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:4px;padding:0 10px;background:var(--sf)}
.ctl:focus-within{border-color:var(--ac);outline:1px solid var(--ac)}
.ctl input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:7px 0;text-align:right;font-variant-numeric:tabular-nums;outline:none}
.ctl .u{color:var(--mu);font-size:13px;white-space:nowrap}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--ac)}
.hint{font-size:12.5px;color:var(--mu);margin-top:3px;min-height:1.1em}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);margin-bottom:18px}
.k{background:var(--sf);padding:12px 14px}
.k .l{font-size:13px;color:var(--mu)}
.k .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.k .v small{font-size:13px;font-weight:500;color:var(--mu);margin-left:3px}
.k .s{font-size:12.5px;color:var(--mu)}
.k.neg .v{color:var(--bad)}.k.pos .v{color:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;padding:9px 14px;font:inherit;color:var(--mu);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ac);font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.hd h2{font-size:16px;margin:0}
button.b,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:6px 12px;min-height:34px;cursor:pointer}
button.b:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ov{overflow:auto;border:1px solid var(--ln)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--sf);z-index:1}
thead th{background:var(--hl);font-weight:600;font-size:13px}
thead th:first-child{background:var(--hl)}
tr.t td{font-weight:700;background:var(--hl)}
tr.t td:first-child{background:var(--hl)}
td.neg{color:var(--bad)}
td input.cell{width:92px;border:1px solid var(--ln);border-radius:3px;background:var(--sf);color:var(--ink);font:inherit;font-size:14px;text-align:right;padding:4px 6px;font-variant-numeric:tabular-nums}
td input.cell:disabled{background:var(--hl);color:var(--mu);border-style:dashed;cursor:not-allowed}
td.off{color:var(--mu);background:var(--hl)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:14px 0 0}
.row label{margin:0}
.row select,.row input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:6px 8px;min-height:34px}
.row input{width:120px;text-align:right}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mu);font:11px Figtree,Arial,sans-serif}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mu);margin:6px 0 14px}
.lg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.note{color:var(--mu);font-size:13px;margin-top:12px;max-width:100ch}
.st{font-size:13px;color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);margin:0 0 16px}
</style>
</head>
<body>
<div class="wrap">
<h1>Ocena finansowa projektów</h1>
<p class="sub">Wpływy i wydatki w ujęciu kasowym (kwartalnie, projekt do 12 kwartałów, wpływy do 40 kwartałów), wskaźniki efektywności oraz efekt P&amp;L wynikający ze stawek amortyzacji. Kwoty w zł.</p>
<div class="lay">
 <div class="pn in" id="in"></div>
 <div>
  <div class="kp" id="kp"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="pn" id="body"></div>
 </div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const CATS=[['hw','Hardware'],['sw','Software'],['us','Usługi obce'],['ot','Inne środki trwałe']];
const MAXQ=40,MAXP=12;
const okE=(i,P)=>i>=1&&i<=P, okR=(i,R)=>i>=2&&i<=R;
const z=()=>new Array(MAXQ+1).fill(0);
const S={P:4,R:8,wacc:10,conv:'end',start:1,rate:{hw:30,sw:50,us:20,ot:20},rev:z(),exp:{hw:z(),sw:z(),us:z(),ot:z()},tab:'in'};
(function demo(){const r=[0,0,150000,250000,300000,350000,350000,350000,350000],h=[0,300000,100000],s=[0,200000,150000],u=[0,100000,100000,50000],o=[0,50000];
 r.forEach((v,i)=>S.rev[i]=v);h.forEach((v,i)=>S.exp.hw[i]=v);s.forEach((v,i)=>S.exp.sw[i]=v);u.forEach((v,i)=>S.exp.us[i]=v);o.forEach((v,i)=>S.exp.ot[i]=v)})();

/* ================= SILNIK ================= */
function irrOf(f){
 if(!(f.some(v=>v<0)&&f.some(v=>v>0)))return NaN;
 const g=r=>f.reduce((s,v,i)=>s+v/Math.pow(1+r,i),0);let ga=g(-0.99);
 for(let r=-0.98;r<=10;r+=0.01){const gr=g(r);if(ga*gr<=0){let lo=r-0.01,hi=r;for(let i=0;i<100;i++){const m=(lo+hi)/2;if(g(lo)*g(m)<=0)hi=m;else lo=m}return(lo+hi)/2}ga=gr}
 return NaN}
function paybackOf(f,t){
 let prev=0;
 for(let j=0;j<f.length;j++){const c=prev+f[j];
  if(prev<0&&c>=0)return t[j]-1+(-prev/f[j]);
  if(j===0&&c>=0)return 0;
  prev=c}
 return null}
function depreciation(cat,N,rates,start){
 const dep={},nbv={};
 CATS.forEach(([k])=>{const qr=rates[k]/400;dep[k]=new Array(N).fill(0);
  for(let j=0;j<N;j++){const A=cat[k][j];if(!A||!qr)continue;let rem=A;for(let m=j+start;m<N&&rem>1e-9;m++){const ch=Math.min(A*qr,rem);dep[k][m]+=ch;rem-=ch}}
  let c=0,d=0;nbv[k]=cat[k].map((v,j)=>{c+=v;d+=dep[k][j];return c-d})});
 return{dep,nbv}}
function model(S,rates){
 rates=rates||S.rate;const N=Math.max(S.P,S.R),rq=Math.pow(1+S.wacc/100,.25)-1,sh=S.conv==='end'?0:1;
 const q=[...Array(N)].map((_,i)=>i+1);
 const inflow=q.map(i=>okR(i,S.R)?S.rev[i]:0);
 const cat={};CATS.forEach(([k])=>cat[k]=q.map(i=>okE(i,S.P)?S.exp[k][i]:0));
 const outflow=q.map((_,j)=>CATS.reduce((s,[k])=>s+cat[k][j],0));
 const net=q.map((_,j)=>inflow[j]-outflow[j]);
 const t=q.map(i=>i-sh),df=t.map(x=>1/Math.pow(1+rq,x)),dnet=net.map((v,j)=>v*df[j]);
 const cum=[],dcum=[];let c=0,d=0;net.forEach((v,j)=>{c+=v;d+=dnet[j];cum.push(c);dcum.push(d)});
 const sum=a=>a.reduce((s,v)=>s+v,0),sumIn=sum(inflow),sumOut=sum(outflow);
 const pvIn=sum(inflow.map((v,j)=>v*df[j])),pvOut=sum(outflow.map((v,j)=>v*df[j]));
 const iq=irrOf(net),irrA=isNaN(iq)?NaN:Math.pow(1+iq,4)-1;
 const dp=depreciation(cat,N,rates,S.start);
 const depTot=q.map((_,j)=>CATS.reduce((s,[k])=>s+dp.dep[k][j],0)),nbvTot=q.map((_,j)=>CATS.reduce((s,[k])=>s+dp.nbv[k][j],0));
 const ebit=q.map((_,j)=>inflow[j]-depTot[j]);let pc=0;const ebitCum=ebit.map(v=>pc+=v);
 const plRes=sum(ebit),nbvEnd=nbvTot[N-1];
 return{N,P:S.P,R:S.R,q,rq,inflow,outflow,cat,net,t,df,dnet,cum,dcum,sumIn,sumOut,pvIn,pvOut,npv:dcum[N-1],iq,irrA,
  roi:sumOut>0?(sumIn-sumOut)/sumOut*100:NaN,pi:pvOut>0?pvIn/pvOut:NaN,pb:paybackOf(net,t),dpb:paybackOf(dnet,t),
  dep:dp.dep,nbv:dp.nbv,depTot,nbvTot,ebit,ebitCum,plRes,nbvEnd,depSum:sum(depTot),plAfter:plRes-nbvEnd}}
/* ================= /SILNIK ================= */

const fmt=(v,d=0)=>v.toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const f0=v=>fmt(Math.abs(v)<0.5?0:v);
const parse=s=>{s=String(s).replace(/[\s\u00a0]/g,'').replace(',','.');return s===''||isNaN(+s)?NaN:+s};
const clamp=(v,a,b,d)=>{v=Math.min(b,Math.max(a,v));const m=Math.pow(10,d);return Math.round(v*m)/m};
const years=n=>fmt(n/4,2);

let M=null;
function buildIn(){
 $('#in').innerHTML=`<h2>Parametry projektu</h2>
 <div class="fld"><label for="t-P">Czas trwania projektu (kwartały)</label><div class="ctl"><input id="t-P" type="text" inputmode="numeric" autocomplete="off"><span class="u">kw.</span></div><input id="r-P" type="range" min="1" max="12" step="1" aria-label="Czas trwania projektu"><div class="hint" id="h-P"></div></div>
 <div class="fld"><label for="t-R">Czas realizacji wpływów (do kwartału)</label><div class="ctl"><input id="t-R" type="text" inputmode="numeric" autocomplete="off"><span class="u">kw.</span></div><input id="r-R" type="range" min="2" max="40" step="1" aria-label="Czas realizacji wpływów"><div class="hint" id="h-R"></div></div>
 <div class="fld"><label for="t-w">WACC (stopa dyskontowa, rocznie)</label><div class="ctl"><input id="t-w" type="text" inputmode="decimal" autocomplete="off"><span class="u">%</span></div><input id="r-w" type="range" min="0" max="30" step="0.1" aria-label="WACC"><div class="hint" id="h-w"></div></div>
 <div class="fld"><span class="lb" id="lbc">Moment przepływu w kwartale</span><div class="seg" id="conv" role="group" aria-labelledby="lbc"><button type="button" data-c="end">Koniec kwartału</button><button type="button" data-c="start">Początek kwartału</button></div><div class="hint" id="h-conv"></div></div>
 <h2>Stawki amortyzacji (% rocznie)</h2>
 ${CATS.map(([k,l])=>`<div class="fld"><label for="t-${k}">${l}</label><div class="ctl"><input id="t-${k}" type="text" inputmode="decimal" autocomplete="off"><span class="u">% rocznie</span></div></div>`).join('')}
 <div class="fld"><span class="lb" id="lbs">Początek amortyzacji</span><div class="seg" id="start" role="group" aria-labelledby="lbs"><button type="button" data-s="0">Kwartał wydatku</button><button type="button" data-s="1">Kwartał następny</button></div></div>
 <div class="hint">Amortyzacja liniowa, naliczana kwartalnie (stawka roczna / 4) do wartości zerowej.</div>`;
 const W=$('#t-w'),rW=$('#r-w');
 W.value=fmt(S.wacc,1);rW.value=S.wacc;
 [['P',1,MAXP],['R',2,MAXQ]].forEach(([k,lo,hi])=>{const T=$('#t-'+k),Rg=$('#r-'+k);T.value=S[k];Rg.value=S[k];
  const set=v=>{S[k]=clamp(v,lo,hi,0);Rg.value=S[k];update(true)};
  T.addEventListener('input',()=>{const v=parse(T.value);if(!isNaN(v))set(v)});T.addEventListener('blur',()=>{T.value=S[k]});T.addEventListener('focus',()=>T.select());
  Rg.addEventListener('input',()=>{set(+Rg.value);T.value=S[k]})});
 const setW=v=>{S.wacc=clamp(v,0,100,2);update()};
 W.addEventListener('input',()=>{const v=parse(W.value);if(!isNaN(v)){setW(v);rW.value=Math.min(30,S.wacc)}});W.addEventListener('blur',()=>{W.value=fmt(S.wacc,S.wacc%1?2:1)});W.addEventListener('focus',()=>W.select());
 rW.addEventListener('input',()=>{S.wacc=+rW.value;W.value=fmt(S.wacc,1);update()});
 document.querySelectorAll('#conv button').forEach(b=>b.onclick=()=>{S.conv=b.dataset.c;update()});
 document.querySelectorAll('#start button').forEach(b=>b.onclick=()=>{S.start=+b.dataset.s;update()});
 CATS.forEach(([k])=>{const t=$('#t-'+k);t.value=fmt(S.rate[k],0);
  t.addEventListener('input',()=>{const v=parse(t.value);if(!isNaN(v)){S.rate[k]=clamp(v,0,100,2);update()}});
  t.addEventListener('blur',()=>{t.value=fmt(S.rate[k],S.rate[k]%1?2:0)});t.addEventListener('focus',()=>t.select())})
}
const TABS=[['in','Wpływy i wydatki'],['cf','Przepływy i wskaźniki'],['pl','Amortyzacja i P&L']];
function build(){
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" role="tab" data-t="${k}">${l}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;renderTab()});
 buildIn();update(true)}

function update(full){
 document.querySelectorAll('#conv button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===S.conv));
 document.querySelectorAll('#start button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===S.start));
 M=model(S);
 $('#h-P').textContent=`Wydatki można wprowadzać w Q1–Q${S.P} (${years(S.P)} roku). Maks. 12 kwartałów (3 lata).`;
 $('#h-R').textContent=`Wpływy możliwe od Q2 do Q${S.R}`+(S.R>S.P?` – ${S.R-S.P} kw. po zakończeniu projektu.`:'.')+` Horyzont analizy: ${Math.max(S.P,S.R)} kw. (${years(Math.max(S.P,S.R))} roku). Maks. 40 kwartałów (10 lat).`;
 $('#h-w').textContent=`Stopa kwartalna: ${fmt(M.rq*100,3)}% (równoważna rocznej).`;
 $('#h-conv').textContent=S.conv==='end'?'Przepływ z Q1 dyskontowany o 1 kwartał (t = 1…N).':'Przepływ z Q1 w chwili zero (t = 0…N−1).';
 kpis();
 if(full||S.tab!=='in')renderTab()
}
function kpis(){
 const m=M,pb=v=>v===null?['brak','','Nie zwraca się w okresie projektu']:[fmt(v,2),'kw.',`${years(v)} roku`];
 const a=pb(m.pb),d=pb(m.dpb);
 const K=[
  ['NPV',f0(m.npv),'zł',`WACC ${fmt(S.wacc,S.wacc%1?2:1)}% rocznie`,m.npv>=0?'pos':'neg'],
  ['IRR (rocznie)',isNaN(m.irrA)?'brak':fmt(m.irrA*100,2),isNaN(m.irrA)?'':'%',isNaN(m.iq)?'Brak zmiany znaku przepływów':`Kwartalnie: ${fmt(m.iq*100,2)}%`,isNaN(m.irrA)?'':(m.irrA>=S.wacc/100?'pos':'neg')],
  ['ROI (kasowe)',isNaN(m.roi)?'brak':fmt(m.roi,1),isNaN(m.roi)?'':'%',`Wpływy ${f0(m.sumIn)} zł; wydatki ${f0(m.sumOut)} zł`,isNaN(m.roi)?'':(m.roi>=0?'pos':'neg')],
  ['Okres zwrotu (prosty)',a[0],a[1],a[2],''],
  ['Okres zwrotu (zdyskontowany)',d[0],d[1],d[2],''],
  ['Wskaźnik rentowności (PI)',isNaN(m.pi)?'brak':fmt(m.pi,2),'','PV wpływów / PV wydatków',isNaN(m.pi)?'':(m.pi>=1?'pos':'neg')],
  ['Wynik P&L po projekcie',f0(m.plRes),'zł',`Wartość netto środków: ${f0(m.nbvEnd)} zł`,m.plRes>=0?'pos':'neg']];
 $('#kp').innerHTML=K.map(([l,v,u,s,c])=>`<div class="k ${c}"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div><div class="s">${s}</div></div>`).join('')
}

const cn=v=>v<-0.5?' class="neg"':'';
const qh=N=>[...Array(N)].map((_,i)=>`<th>Q${i+1}</th>`).join('');
function chart(){
 const m=M,N=m.N,W=700,H=270,L=62,T=10,B=26,pw=W-L-8,ph=H-T-B;
 const out=m.outflow.map(v=>-v),vals=[...m.inflow,...out,...m.cum,0];
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mx===mn){mx=mn+1}
 let st=Math.pow(10,Math.floor(Math.log10((mx-mn)/4)));const k=(mx-mn)/4/st;st*=k>5?10:k>2?5:k>1?2:1;mn=Math.floor(mn/st)*st;mx=Math.ceil(mx/st)*st;
 const y=v=>T+ph*(1-(v-mn)/(mx-mn)),bw=pw/N,w=Math.min(bw*.55,46);let g='';
 for(let v=mn;v<=mx+1e-9;v+=st)g+=`<line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
 for(let j=0;j<N;j++){const x=L+j*bw+(bw-w)/2;
  if(m.inflow[j])g+=`<rect x="${x}" y="${y(m.inflow[j])}" width="${w}" height="${y(0)-y(m.inflow[j])}" fill="#2A9D8F"><title>Q${j+1} wpływy: ${f0(m.inflow[j])}</title></rect>`;
  if(out[j])g+=`<rect x="${x}" y="${y(0)}" width="${w}" height="${y(out[j])-y(0)}" fill="#D1603D"><title>Q${j+1} wydatki: ${f0(m.outflow[j])}</title></rect>`;
  if(N<=14||(j+1)%4===0||j===0)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">Q${j+1}</text>`}
 g+=`<path d="${m.cum.map((v,j)=>(j?'L':'M')+(L+j*bw+bw/2)+','+y(v)).join('')}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
 m.cum.forEach((v,j)=>g+=`<circle cx="${L+j*bw+bw/2}" cy="${y(v)}" r="3" fill="var(--ink)"><title>Q${j+1} skumulowany przepływ netto: ${f0(v)}</title></circle>`);
 return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wpływy, wydatki i skumulowany przepływ netto">${g}</svg><div class="lg"><span><i style="background:#2A9D8F"></i>Wpływy</span><span><i style="background:#D1603D"></i>Wydatki</span><span>— Skumulowany przepływ netto</span></div>`}
const copyBtn=id=>`<button class="b" type="button" data-copy="${id}">Kopiuj do Excela</button> <span class="st" data-st="${id}"></span>`;

function renderTab(){
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===S.tab));
 const B=$('#body'),m=M,N=m.N;let h='';
 if(S.tab==='in'){
  const rows=[['rev','Wpływy (przychody z projektu)'],...CATS.map(([k,l])=>[k,'Wydatki: '+l])];
  const get=(k,i)=>k==='rev'?S.rev[i]:S.exp[k][i];
  const ok=(k,i)=>k==='rev'?okR(i,S.R):okE(i,S.P);
  const tot=k=>{let s=0;for(let i=1;i<=N;i++)s+=(ok(k,i)?get(k,i):0);return s};
  h=`<div class="hd"><h2>Wpływy i wydatki kasowe (zł)</h2><span class="st">Projekt: Q1–Q${S.P}; wpływy: Q2–Q${S.R}.</span></div>
  <div class="ov"><table id="t-in"><thead><tr><th></th>${qh(N)}<th>Razem</th></tr></thead><tbody>
  ${rows.map(([k,l])=>`<tr><td>${l}</td>${[...Array(N)].map((_,j)=>{const i=j+1;return !ok(k,i)?`<td class="off" title="${k==='rev'?'Poza okresem realizacji wpływów (Q2–Q'+S.R+')':'Poza czasem trwania projektu (Q1–Q'+S.P+')'}">—</td>`:`<td><input class="cell" data-k="${k}" data-q="${i}" type="text" inputmode="decimal" value="${fmt(get(k,i))}" aria-label="${l}, Q${i}"></td>`}).join('')}<td id="tt-${k}">${f0(tot(k))}</td></tr>`).join('')}
  <tr class="t"><td>Wydatki razem</td>${m.outflow.map(v=>`<td>${f0(v)}</td>`).join('')}<td>${f0(m.sumOut)}</td></tr></tbody></table></div>
  <div class="row"><label>Wiersz<br><select id="fr">${rows.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
   <label>Od kwartału<br><select id="ff"></select></label>
   <label>Do kwartału<br><select id="ft"></select></label>
   <label>Kwota (zł)<br><input id="fa" type="text" inputmode="decimal" value="100 000"></label>
   <label>Sposób<br><select id="fm"><option value="each">W każdym kwartale</option><option value="split">Rozłóż kwotę łączną po równo</option></select></label>
   <button class="b" id="fb" type="button">Wypełnij</button><button class="b" id="fc" type="button">Wyczyść wszystko</button><button class="b" id="fd" type="button">Przykład</button></div>
  <p class="note">Wydatki można wprowadzać w czasie trwania projektu (do 12 kwartałów), wpływy od Q2 do końca czasu realizacji wpływów (do 40 kwartałów; mogą wystąpić także po zakończeniu projektu). Dane spoza dozwolonych okresów są zachowane, ale nie są liczone.</p>`}
 else if(S.tab==='cf'){
  const R=(l,a,f,t)=>`<tr class="${t?'t':''}"><td>${l}</td>${a.map(v=>`<td${cn(v)}>${f(v)}</td>`).join('')}</tr>`;
  const tot=a=>a.reduce((s,v)=>s+v,0);
  h=`<div class="hd"><h2>Przepływy pieniężne i skumulowane</h2></div>${chart()}
  <div class="hd"><h2>Tabela przepływów (zł)</h2><span>${copyBtn('t-cf')}</span></div>
  <div class="ov"><table id="t-cf"><thead><tr><th></th>${qh(N)}<th>Razem</th></tr></thead><tbody>
  <tr><td>Wpływy</td>${m.inflow.map(v=>`<td>${f0(v)}</td>`).join('')}<td>${f0(m.sumIn)}</td></tr>
  <tr><td>Wydatki</td>${m.outflow.map(v=>`<td>${f0(-v)}</td>`).join('')}<td>${f0(-m.sumOut)}</td></tr>
  <tr class="t"><td>Przepływ netto</td>${m.net.map(v=>`<td${cn(v)}>${f0(v)}</td>`).join('')}<td>${f0(tot(m.net))}</td></tr>
  <tr><td>Przepływ skumulowany</td>${m.cum.map(v=>`<td${cn(v)}>${f0(v)}</td>`).join('')}<td></td></tr>
  <tr><td>Okres t (kwartały)</td>${m.t.map(v=>`<td>${v}</td>`).join('')}<td></td></tr>
  <tr><td>Czynnik dyskontowy</td>${m.df.map(v=>`<td>${fmt(v,4)}</td>`).join('')}<td></td></tr>
  <tr class="t"><td>Przepływ zdyskontowany</td>${m.dnet.map(v=>`<td${cn(v)}>${f0(v)}</td>`).join('')}<td>${f0(m.npv)}</td></tr>
  <tr><td>Zdyskontowany skumulowany</td>${m.dcum.map(v=>`<td${cn(v)}>${f0(v)}</td>`).join('')}<td></td></tr></tbody></table></div>
  <p class="note">NPV to suma przepływów netto zdyskontowanych kwartalną stopą równoważną rocznemu WACC. IRR jest wyznaczany dla przepływów kwartalnych i przeliczany na stopę roczną efektywną. ROI = (wpływy − wydatki) / wydatki. Okres zwrotu to moment, w którym skumulowany przepływ przestaje być ujemny, z interpolacją w obrębie kwartału. Wszystkie wskaźniki dotyczą przepływów kasowych i nie zależą od stawek amortyzacji.</p>`}
 else{
  const L=(l,a,f,t,neg)=>`<tr class="${t?'t':''}"><td>${l}</td>${a.map(v=>`<td${neg?cn(v):''}>${f(v)}</td>`).join('')}<td>${t===2?'':f(a.reduce((s,v)=>s+v,0))}</td></tr>`;
  const sens=[10,20,30,40,50,75,100].map(r=>{const mm=model(S,{hw:r,sw:r,us:r,ot:r});return`<tr><td>${r}%</td><td>${f0(mm.depSum)}</td><td${cn(mm.plRes)}>${f0(mm.plRes)}</td><td>${f0(mm.nbvEnd)}</td></tr>`}).join('');
  h=`<div class="hd"><h2>Efekt P&amp;L po zakończeniu projektu</h2></div>
  <div class="sum">
   <div class="k"><div class="l">Przychody w okresie projektu</div><div class="v">${f0(m.sumIn)}<small>zł</small></div></div>
   <div class="k"><div class="l">Amortyzacja w okresie projektu</div><div class="v">${f0(m.depSum)}<small>zł</small></div><div class="s">Wg stawek: ${CATS.map(([k,l])=>`${l} ${fmt(S.rate[k],S.rate[k]%1?2:0)}%`).join(', ')}</div></div>
   <div class="k ${m.plRes>=0?'pos':'neg'}"><div class="l">Wynik P&amp;L (przychody − amortyzacja)</div><div class="v">${f0(m.plRes)}<small>zł</small></div></div>
   <div class="k"><div class="l">Wartość netto pozostająca po projekcie</div><div class="v">${f0(m.nbvEnd)}<small>zł</small></div><div class="s">Nieumorzona część wydatków (bilans)</div></div>
   <div class="k ${m.plAfter>=0?'pos':'neg'}"><div class="l">Wynik po pełnym odpisie wartości pozostającej</div><div class="v">${f0(m.plAfter)}<small>zł</small></div><div class="s">Równy wynikowi kasowemu projektu</div></div>
  </div>
  <div class="hd"><h2>P&amp;L i wartość netto w kwartałach (zł)</h2><span>${copyBtn('t-pl')}</span></div>
  <div class="ov"><table id="t-pl"><thead><tr><th></th>${qh(N)}<th>Razem</th></tr></thead><tbody>
  ${L('Przychody',m.inflow,f0)}
  ${CATS.map(([k,l])=>L('Amortyzacja: '+l,m.dep[k].map(v=>-v),f0,0,1)).join('')}
  ${L('Amortyzacja razem',m.depTot.map(v=>-v),f0,0,1)}
  ${L('Wynik P&L w kwartale',m.ebit,f0,1,1)}
  <tr><td>Wynik P&amp;L narastająco</td>${m.ebitCum.map(v=>`<td${cn(v)}>${f0(v)}</td>`).join('')}<td></td></tr>
  ${CATS.map(([k,l])=>`<tr><td>Wartość netto: ${l}</td>${m.nbv[k].map(v=>`<td>${f0(v)}</td>`).join('')}<td></td></tr>`).join('')}
  <tr class="t"><td>Wartość netto razem</td>${m.nbvTot.map(v=>`<td>${f0(v)}</td>`).join('')}<td></td></tr></tbody></table></div>
  <div class="hd" style="margin-top:18px"><h2>Wrażliwość na stawkę amortyzacji</h2></div>
  <div class="ov"><table><thead><tr><th>Jednakowa stawka roczna</th><th>Amortyzacja w okresie</th><th>Wynik P&amp;L</th><th>Wartość netto po projekcie</th></tr></thead><tbody>${sens}</tbody></table></div>
  <p class="note">Wydatki w ujęciu kasowym są kapitalizowane i amortyzowane liniowo według stawki rocznej dla danej kategorii (${S.start?'od kwartału następującego po wydatku':'od kwartału wydatku'}). Wynik P&amp;L obejmuje wyłącznie amortyzację zaliczoną do końca projektu, więc wyższa stawka obniża wynik w okresie projektu i zmniejsza wartość pozostającą w bilansie. Suma wyniku P&amp;L i wartości pozostającej minus wynik kasowy wynosi zero. Podatki i koszty operacyjne nie są uwzględnione.</p>`}
 B.innerHTML=h;
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTable(b.dataset.copy));
 if(S.tab==='in')bindIn()
}
function fillOpts(){
 const k=$('#fr').value,lo=k==='rev'?2:1,hi=k==='rev'?S.R:S.P,o=[];
 for(let i=lo;i<=hi;i++)o.push(i);
 $('#ff').innerHTML=o.map(i=>`<option value="${i}">Q${i}</option>`).join('');
 $('#ft').innerHTML=o.map(i=>`<option value="${i}"${i===hi?' selected':''}>Q${i}</option>`).join('')}
function bindIn(){
 fillOpts();$('#fr').addEventListener('change',fillOpts);
 document.querySelectorAll('input.cell').forEach(inp=>{
  const k=inp.dataset.k,i=+inp.dataset.q,arr=k==='rev'?S.rev:S.exp[k];
  inp.addEventListener('input',()=>{const v=parse(inp.value);arr[i]=isNaN(v)||v<0?0:v;M=model(S);kpis();refreshIn()});
  inp.addEventListener('blur',()=>{inp.value=fmt(arr[i])});inp.addEventListener('focus',()=>inp.select())});
 $('#fb').onclick=()=>{const k=$('#fr').value,a=+$('#ff').value,b=+$('#ft').value,v=parse($('#fa').value);if(isNaN(v)||v<0)return;
  const lo=Math.min(a,b),hi=Math.max(a,b),arr=k==='rev'?S.rev:S.exp[k];let cnt=0;for(let i=lo;i<=hi;i++)if(k==='rev'?okR(i,S.R):okE(i,S.P))cnt++;if(!cnt)return;
  for(let i=lo;i<=hi;i++){if(!(k==='rev'?okR(i,S.R):okE(i,S.P)))continue;arr[i]=$('#fm').value==='split'?v/cnt:v}
  update(true)};
 $('#fc').onclick=()=>{S.rev=z();CATS.forEach(([k])=>S.exp[k]=z());update(true)};
 $('#fd').onclick=()=>{S.rev=z();CATS.forEach(([k])=>S.exp[k]=z());S.P=4;S.R=8;
  [0,0,150000,250000,300000,350000,350000,350000,350000].forEach((v,i)=>S.rev[i]=v);[0,300000,100000].forEach((v,i)=>S.exp.hw[i]=v);[0,200000,150000].forEach((v,i)=>S.exp.sw[i]=v);[0,100000,100000,50000].forEach((v,i)=>S.exp.us[i]=v);[0,50000].forEach((v,i)=>S.exp.ot[i]=v);update(true)}
}
function refreshIn(){
 const N=M.N;[['rev',null],...CATS.map(([k])=>[k,null])].forEach(([k])=>{let s=0;for(let i=1;i<=N;i++)s+=(k==='rev'?(okR(i,S.R)?S.rev[i]:0):(okE(i,S.P)?S.exp[k][i]:0));const e=document.getElementById('tt-'+k);if(e)e.textContent=f0(s)});
 const t=document.querySelector('#t-in tr.t');if(t)t.innerHTML=`<td>Wydatki razem</td>${M.outflow.map(v=>`<td>${f0(v)}</td>`).join('')}<td>${f0(M.sumOut)}</td>`
}
function copyTable(id){
 const t=document.getElementById(id),st=document.querySelector(`[data-st="${id}"]`);
 const txt=[...t.rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/(\d)[\s\u00a0](?=\d)/g,'$1').replace(/[\s\u00a0]+/g,' ').trim()).join('\t')).join('\n');
 const done=m=>{st.textContent=m;setTimeout(()=>{st.textContent=''},4000)};
 navigator.clipboard.writeText(txt).then(()=>done('Skopiowano. Wklej w Excelu.')).catch(()=>{try{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();done('Skopiowano. Wklej w Excelu.')}catch(e){done('Nie udało się skopiować.')}})
}
build();
</script>

era wartość końcową.": " La dernière échéance comprend la valeur résiduelle.", "Założenia sprzedaży (liczba umów w miesiącu)": "Hypothèses de ventes (nombre de contrats par mois)", "Założenia sprzedaży – roczne (Y1–Y5)": "Hypothèses de ventes – annuelles (A1–A5)", "Wypełnij wszystkie miesiące": "Remplir tous les mois", "Zastosuj": "Appliquer", "Wklej z Excela": "Coller depuis Excel", "Przywróć dane z arkusza": "Rétablir les données du classeur", "Wczytaj": "Charger", "Wklej do 60 liczb (z kolumny lub wiersza Excela)": "Collez jusqu’à 60 nombres (colonne ou ligne Excel)", "Nie znaleziono liczb.": "Aucun nombre trouvé.", "Średnia wartość umowy:": "Valeur moyenne du contrat :", "umów, wartość": "contrats, valeur", "Sprzedaż to liczba umów o wartości podanej w profilu umowy. Portfel w miesiącu sprzedaży zaczyna się od salda początkowego profilu, a po zakończeniu umowy spada do zera.": "Les ventes sont un nombre de contrats de la valeur indiquée dans le profil du contrat. L’encours démarre au mois de vente au solde initial du profil et retombe à zéro à la fin du contrat.", "Wartości roczne wpisujesz w panelu po lewej stronie. Każdy miesiąc roku dostaje 1/12 sprzedaży rocznej, a liczba umów to sprzedaż miesięczna podzielona przez średnią wartość umowy i zaokrąglona w dół do liczby naturalnej. Portfel jest liczony od tej liczby umów, więc sprzedaż wynikająca z liczby umów (umów × średnia wartość) jest nieco niższa od planu rocznego. Po 60 miesiącach sprzedaż się kończy i portfel wygasa. Przełącz sposób zadania sprzedaży na „Miesięczna”, aby wpisać liczbę umów w poszczególnych miesiącach.": "Les montants annuels se saisissent dans le panneau de gauche. Chaque mois de l’année reçoit 1/12 des ventes annuelles ; le nombre de contrats est les ventes mensuelles divisées par la valeur moyenne du contrat, arrondi à l’entier inférieur. L’encours est calculé à partir de ce nombre de contrats, de sorte que les ventes résultantes (contrats × valeur moyenne) sont légèrement inférieures au plan annuel. Au bout de 60 mois, les ventes s’arrêtent et l’encours s’éteint. Passez le mode de saisie sur « Mensuelle » pour saisir le nombre de contrats mois par mois.", "Podaj wartość umowy większą od zera.": "Saisissez une valeur de contrat supérieure à zéro.", "Wartość końcowa jest zbyt wysoka względem kwoty finansowanej: rata byłaby niedodatnia. Zmniejsz wartość końcową.": "La valeur résiduelle est trop élevée par rapport au montant financé : l’échéance serait non positive. Réduisez la valeur résiduelle.", "Amortyzacja i P&L": "Amortissement et P&L", "Amortyzacja liniowa, naliczana kwartalnie (stawka roczna / 4) do wartości zerowej.": "Amortissement linéaire, calculé trimestriellement (taux annuel / 4) jusqu’à la valeur zéro.", "Amortyzacja razem": "Amortissement total", "Amortyzacja w okresie projektu": "Amortissement pendant le projet", "Amortyzacja w okresie": "Amortissement sur la période", "Amortyzacja:": "Amortissement :", "Amortyzacja": "Amortissement", "Stawki amortyzacji (% rocznie)": "Taux d’amortissement (% par an)", "Hardware": "Matériel (hardware)", "Software": "Logiciels (software)", "Usługi obce": "Services externes", "Inne środki trwałe": "Autres immobilisations", "Brak zmiany znaku przepływów": "Pas de changement de signe des flux", "Czas realizacji wpływów (do kwartału)": "Durée de réalisation des encaissements (jusqu’au trimestre)", "Czas realizacji wpływów": "Durée de réalisation des encaissements", "Czas trwania projektu (kwartały)": "Durée du projet (trimestres)", "Czas trwania projektu": "Durée du projet", "Parametry projektu": "Paramètres du projet", "WACC (stopa dyskontowa, rocznie)": "WACC (taux d’actualisation, annuel)", "Do kwartału": "Au trimestre", "Od kwartału": "Du trimestre", "Efekt P&L po zakończeniu projektu": "Effet P&L après la fin du projet", "Koniec kwartału": "Fin du trimestre", "Początek kwartału": "Début du trimestre", "Kwartał następny": "Trimestre suivant", "Kwartał wydatku": "Trimestre de la dépense", "Kwota": "Montant", "Moment przepływu w kwartale": "Moment du flux dans le trimestre", "NPV to suma przepływów netto zdyskontowanych kwartalną stopą równoważną rocznemu WACC. IRR jest wyznaczany dla przepływów kwartalnych i przeliczany na stopę roczną efektywną. ROI = (wpływy − wydatki) / wydatki. Okres zwrotu to moment, w którym skumulowany przepływ przestaje być ujemny, z interpolacją w obrębie kwartału. Wszystkie wskaźniki dotyczą przepływów kasowych i nie zależą od stawek amortyzacji.": "La VAN est la somme des flux nets actualisés à un taux trimestriel équivalent au WACC annuel. Le TRI est calculé sur les flux trimestriels et converti en taux annuel effectif. ROI = (encaissements − dépenses) / dépenses. Le délai de récupération est le moment où le flux cumulé cesse d’être négatif, avec interpolation au sein du trimestre. Tous les indicateurs portent sur les flux de trésorerie et ne dépendent pas des taux d’amortissement.", "Nie zwraca się w okresie projektu": "Non récupéré sur l’horizon d’analyse", "Nieumorzona część wydatków (bilans)": "Part non amortie des dépenses (bilan)", "Ocena finansowa projektów": "Évaluation financière de projets", "Okres t (kwartały)": "Période t (trimestres)", "Okres zwrotu": "Délai de récupération", "prosty": "simple", "zdyskontowany": "actualisé", "P&L i wartość netto w kwartałach": "P&L et valeur nette par trimestre", "PV wpływów / PV wydatków": "VA des encaissements / VA des dépenses", "Początek amortyzacji": "Début de l’amortissement", "Poza czasem trwania projektu": "Hors durée du projet", "Poza okresem realizacji wpływów": "Hors période d’encaissement", "Projekt:": "Projet :", "wpływy:": "encaissements :", "Przepływ netto": "Flux net", "Przepływ skumulowany": "Flux cumulé", "Przepływ zdyskontowany": "Flux actualisé", "Przepływ z Q1 dyskontowany o 1 kwartał (t = 1…N).": "Flux du Q1 actualisé d’un trimestre (t = 1…N).", "Przepływ z Q1 w chwili zero (t = 0…N−1).": "Flux du Q1 à l’instant zéro (t = 0…N−1).", "Przepływy pieniężne i skumulowa
