      S.co.errors.pay = null; S.co.busy = true; viewCheckout();
      try {
        if (t.payNow > 0) S.co.payment = await api('payments.pay', { amount: t.payNow, method: pm, orderId: S.co.orderId });
        await saveOrder(S.co.mode === 'purchase' && S.co.params.payOption === 'reservation' ? 'reserved' : 'paid');
        await reload();
        S.co.step++;
      } catch (e) { toast(e.message); }
      S.co.busy = false; window.scrollTo(0, 0); viewCheckout();
    },
    // admin
    async login() {
      const v = $('#pin').value;
      if (CONFIG.apiBase) { sessionStorage.setItem('am_admin_token', v); try { await api('admin.orders.list'); S.admin.authed = true; } catch (e) { sessionStorage.removeItem('am_admin_token'); toast('Nieprawidłowy token'); return; } }
      else { const r = await api('admin.login', { pin: v }); if (!r.ok) { toast('Nieprawidłowy PIN'); return; } S.admin.authed = true; }
      viewAdmin('dash');
    },
    logout() { S.admin.authed = false; sessionStorage.removeItem('am_admin_token'); viewAdmin(); },
    admTab(el) { S.admin.edit = null; S.admin.cat = null; S.admin.set = null; location.hash = '#/admin/' + el.dataset.v; },
    offEdit(el) { S.admin.edit = clone(offerById(el.dataset.id)); viewAdmin('offers'); },
    offDup(el) { const o = clone(offerById(el.dataset.id)); delete o.id; o.title += ' (kopia)'; o.status = 'available'; o._new = true; S.admin.edit = o; viewAdmin('offers'); },
    offNew() { const o = SEED.offer({ title: 'Nowa oferta', make: '', model: '', category: 'car', body: '', condition: 'new', year: new Date().getFullYear(), mileage: 0, fuel: 'Benzyna', gearbox: '', power: '', color: '', location: '', partnerId: S.data.partners[0].id, priceNet: 100000, hue: 200, description: '' }); delete o.id; o._new = true; S.admin.edit = o; viewAdmin('offers'); },
    offCancel() { S.admin.edit = null; viewAdmin('offers'); },
    async offSave() {
      const o = clone(S.admin.edit); delete o._new;
      if (!o.title || !(o.priceNet > 0)) { toast('Uzupełnij nazwę i cenę netto'); return; }
      if (!enabledModes(o).length) { toast('Włącz co najmniej jedną formę nabycia'); return; }
      await api('admin.offer.save', { offer: o }); await reload(); delete S.cfg[o.id]; S.admin.edit = null; toast('Zapisano ofertę'); viewAdmin('offers');
    },
    async offDel() { if (!(await askConfirm('Usunąć ofertę ' + S.admin.edit.title + '?'))) return; await api('admin.offer.delete', { id: S.admin.edit.id }); await reload(); S.admin.edit = null; toast('Usunięto'); viewAdmin('offers'); },
    edArr(el) { const arr = getPath(S.admin.edit, el.dataset.p); const i = arr.indexOf(el.value); if (el.checked && i < 0) arr.push(el.value); if (!el.checked && i >= 0) arr.splice(i, 1); },
    ordToggle(el) { S.admin.open[el.dataset.id] = !S.admin.open[el.dataset.id]; viewAdmin('orders'); },
    catAdd(el) { const k = el.dataset.k; const tpl = { services: { code: 'NEW', label: 'Nowa usługa', priceNet: 0, vat: '23', billing: 'oneoff', appliesTo: ['vehicle', 'asset'] }, insuranceProducts: { code: 'NEW', label: 'Nowy produkt', type: 'fixed', fixed: 0, ratePct: 0, appliesTo: ['vehicle'] }, partners: { id: 'p' + (S.admin.cat.partners.length + 1), name: 'Nowy partner', type: '', city: '' } }[k]; S.admin.cat[k].push(tpl); viewAdmin(); },
    async catSave() { await api('admin.catalog.save', clone(S.admin.cat)); await reload(); S.admin.cat = null; toast('Zapisano'); viewAdmin(); },
    async insTest() { const r = await api('insurance.quotes', { req: { assetType: 'vehicle', value: 100000, postcode: '00-001', driverAge: 35, claimFreeYears: 5 } }); $('#insTestOut').innerHTML = `<div class="log" style="margin-top:10px">${esc(JSON.stringify(r, null, 2))}</div>`; },
    async setSave() { await api('admin.settings.save', { settings: S.admin.set }); await reload(); toast('Zapisano ustawienia'); viewAdmin(); },
    async reset() { if (!(await askConfirm('Przywrócić dane demonstracyjne?'))) return; await api('admin.reset'); await reload(); S.cfg = {}; S.ui.myOrders = []; saveUi(); S.admin.set = null; toast('Przywrócono dane'); viewAdmin('dash'); }
  };

  // obsługa input/change (pola formularzy)
  const I = {
    q(el, ev) { if (ev.type === 'keydown' && ev.key === 'Enter') { S.f.q = el.value; viewHome(); } },
    catsel(el) { S.f.cat = el.value ? [el.value] : []; viewHome(); },
    fck(el) { const k = el.dataset.k, a = S.f[k], i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i, 1); viewHome(); },
    fnum(el) { S.f[el.dataset.k] = el.value; clearTimeout(I._t); I._t = setTimeout(() => { const pos = el.dataset.k; viewHome(); const n = $(`[data-k="${pos}"]`); if (n) { n.focus(); n.setSelectionRange && n.type !== 'number' && n.setSelectionRange(n.value.length, n.value.length); } }, 500); },
    sort(el) { S.ui.sort = el.value; saveUi(); viewHome(); },
    prm(el) { const o = curOffer(); const st = cfgState(o); st.params[el.dataset.k] = Number(el.value); const b = $('#rv-' + el.dataset.k); if (b) { const base = (o.vat === 'marza' || o.vat === 'zw') ? o.priceGross : o.priceNet; const v = Number(el.value); b.textContent = el.dataset.k === 'days' ? v + ' ' + (v === 1 ? 'doba' : v < 5 ? 'doby' : 'dób') : el.dataset.k === 'downPct' && st.mode === 'ltr' ? v + '%' : v + '% · ' + zl(base * v / 100); } refreshCfg(o); if (el.dataset.k === 'days') { const ret = $$('#ctl input[type=date]')[1]; if (ret) ret.value = new Date(new Date(st.params.start).getTime() + st.params.days * 864e5).toISOString().slice(0, 10); } },
    prmdate(el) { const o = curOffer(); const st = cfgState(o); st.params.start = el.value; refreshCfg(o, true); },
    ltrsvc(el) { const o = curOffer(); const st = cfgState(o); const a = st.params.ltrServices; const i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i, 1); refreshCfg(o, true); },
    insck(el) { const o = curOffer(); const st = cfgState(o); const a = st.ins.selected; const i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i, 1); refreshCfg(o); },
    insded(el) { const o = curOffer(); const st = cfgState(o); st.ins.deductiblePct = Number(el.value); refreshCfg(o, true); },
    insinst(el) { const o = curOffer(); const st = cfgState(o); st.ins.inInstallment = el.checked; refreshCfg(o); },
    dynreq(el) { const o = curOffer(); const st = cfgState(o); st.ins.dyn.req[el.dataset.k] = el.type === 'number' ? Number(el.value) : el.value; },
    svc(el) { const o = curOffer(); const st = cfgState(o); const a = st.svc; const i = a.indexOf(el.value); if (el.checked && i < 0) a.push(el.value); if (!el.checked && i >= 0) a.splice(i, 1); refreshCfg(o); },
    coField(el) { S.co.applicant[el.dataset.k] = el.value; if (S.co.errors[el.dataset.k]) { delete S.co.errors[el.dataset.k]; el.classList.remove('err'); const n = el.parentNode.querySelector('.ferr'); if (n) n.remove(); } },
    coBlik(el) { S.co.blik = el.value; },
    coConsent(el) { S.co.consents[el.dataset.k] = el.checked; if (S.co.errors._consents) { delete S.co.errors._consents; const n = $('.consent ~ .ferr'); if (n) n.remove(); } },
    pinEnter(el, ev) { if (ev.type === 'keydown' && ev.key === 'Enter') A.login(); },
    admQ(el) { S.admin.q = el.value; clearTimeout(I._t); I._t = setTimeout(() => { viewAdmin('offers'); const n = $('[data-a="admQ"]'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 400); },
    ed(el) {
      const o = S.admin.edit; const p = el.dataset.p; const v = parseT(el);
      setPath(o, p, v);
      if (p === 'priceNet' || p === 'vat') { if (o.vat !== 'marza') o.priceGross = C.grossFromNet(Number(o.priceNet), o.vat); const g = $('[data-p="priceGross"]'); if (g) g.value = o.priceGross; }
      if (p === 'priceGross') { if (o.vat !== 'marza') { o.priceNet = C.netFromGross(Number(o.priceGross), o.vat); } else o.priceNet = Number(o.priceGross); const n = $('[data-p="priceNet"]'); if (n) n.value = o.priceNet; }
      if (p === 'assetType' && o.modes.ltr) { o.modes.ltr.servicePrices = SEED.modes(o.assetType).ltr.servicePrices; }
      if (el.dataset.t === 'b' && /\.enabled$/.test(p) || p === 'assetType') { viewAdmin('offers'); return; }
      const pv = $('#edPrev'); if (pv) pv.innerHTML = admPreview();
      if (p === 'hue' || p === 'category') { const a = $('#edArt'); if (a) a.innerHTML = art(o); }
    },
    catEd(el) { setPath(S.admin.cat, el.dataset.p, parseT(el)); },
    setEd(el) { setPath(S.admin.set, el.dataset.p, parseT(el)); },
    async ordStatus(el) { await api('admin.orders.status', { id: el.dataset.id, status: el.value }); toast('Zmieniono status'); viewAdmin('orders'); }
  };

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-a]');
    if (!el) return;
    const a = el.dataset.a;
    if (A[a] && (el.tagName === 'BUTTON' || el.tagName === 'A' || el.getAttribute('role') === 'button')) { ev.preventDefault(); Promise.resolve(A[a](el, ev)).catch((e) => toast('Błąd: ' + e.message)); }
  });
  ['input', 'change'].forEach((t) => document.addEventListener(t, (ev) => {
    const el = ev.target; if (!el.dataset || !el.dataset.a) return;
    const h = I[el.dataset.a]; if (!h) return;
    const isText = el.tagName === 'INPUT' && /^(text|email|tel|number|password|search|)$/.test(el.type) || el.tagName === 'TEXTAREA';
    const live = ['prm', 'coField', 'coBlik', 'dynreq', 'fnum', 'admQ', 'ed', 'catEd', 'setEd'];
    if (t === 'input' && live.indexOf(el.dataset.a) < 0) return;
    if (t === 'change' && isText && live.indexOf(el.dataset.a) >= 0 && el.dataset.a !== 'ed') return;
    if (t === 'change' && el.dataset.a === 'ed' && isText) return;
    if (t === 'input' && el.dataset.a === 'ed' && !isText && el.tagName !== 'TEXTAREA') return;
    Promise.resolve(h(el, ev)).catch((e) => toast('Błąd: ' + e.message));
  }));
  document.addEventListener('keydown', (ev) => {
    const el = ev.target; if (el.dataset && (el.dataset.a === 'q' || el.dataset.a === 'pinEnter')) I[el.dataset.a](el, ev);
    if (ev.key === 'Escape') closeModal();
    if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.a) { ev.preventDefault(); A[el.dataset.a](el, ev); }
  });

  // ------------------------------------------------------------------ router
  function parseRoute() {
    const h = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = h.split('?');
    const parts = path.split('/').filter(Boolean);
    const query = {}; (qs || '').split('&').filter(Boolean).forEach((kv) => { const [k, v] = kv.split('='); query[decodeURIComponent(k)] = decodeURIComponent(v || ''); });
    let r = { name: 'home', query };
    if (parts[0] === 'oferta') r = { name: 'detail', id: parts[1], query };
    else if (parts[0] === 'checkout') r = { name: 'checkout', query };
    else if (parts[0] === 'porownaj') r = { name: 'compare', query };
    else if (parts[0] === 'moje') r = { name: 'mine', query };
    else if (parts[0] === 'jak-to-dziala') r = { name: 'how', query };
    else if (parts[0] === 'admin') r = { name: 'admin', tab: parts[1], query };
    return r;
  }
  let lastRoute = '';
  function route() {
    closeModal();
    S.navOpen = false;
    S.route = parseRoute();
    const key = location.hash;
    if (key !== lastRoute) { window.scrollTo(0, 0); lastRoute = key; }
    const r = S.route;
    try {
      if (r.name === 'detail') viewDetail(r.id);
      else if (r.name === 'checkout') viewCheckout();
      else if (r.name === 'compare') viewCompare();
      else if (r.name === 'mine') viewMine();
      else if (r.name === 'how') viewHow();
      else if (r.name === 'admin') viewAdmin(r.tab);
      else viewHome();
    } catch (e) { console.error(e); $('#app').innerHTML = `<div class="wrap"><div class="empty" style="margin:40px 0"><h2>Wystąpił błąd</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#/">Strona główna</a></div></div>`; }
    // komunikacja z osadzającą stroną (iframe auto-height)
    try { if (window.parent !== window) window.parent.postMessage({ type: 'assetmarket:resize', height: document.documentElement.scrollHeight }, '*'); } catch (e) { /* ignore */ }
  }
  window.addEventListener('hashchange', route);

  async function boot() {
    if (!CONFIG.apiBase) LocalDB.load();
    try { S.data = await api('bootstrap'); }
    catch (e) { $('#app').innerHTML = `<div class="wrap"><div class="empty" style="margin:60px 0"><h2>Nie można połączyć się z serwerem</h2><p class="muted">${esc(e.message)}</p></div></div>`; return; }
    document.title = S.data.settings.brand + ' – pojazdy i środki trwałe online';
    route();
  }
  window.AssetMarket = { S, api, totals, version: '1.0.0' };
  boot();
})();
</script>
</body>
</html>
