<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssetMarket – pojazdy i środki trwałe online</title>
<meta name="description" content="Platforma sprzedaży, najmu i leasingu pojazdów oraz środków trwałych – w pełni online, z ubezpieczeniem i usługami.">
<meta name="theme-color" content="#0b2545">
<style>:root{
  --ink:#0d1b2e;--ink-2:#3b4a60;--ink-3:#6b7a90;--line:#e3e8f0;--bg:#f4f6fa;--card:#fff;
  --navy:#0b2545;--navy-2:#13315c;--accent:#0f9d8f;--accent-2:#0b7f74;--accent-soft:#e3f5f2;
  --warm:#f29e4c;--warm-soft:#fff2e3;--danger:#d64545;--danger-soft:#fdeaea;--ok:#1f9d55;--ok-soft:#e5f6ec;
  --info-soft:#e8f0fe;--r:14px;--r-sm:9px;--sh:0 1px 2px rgba(13,27,46,.06),0 6px 24px rgba(13,27,46,.06);
  --sh-lg:0 10px 40px rgba(13,27,46,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent-2);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:750}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:650}
.muted{color:var(--ink-3)}.small{font-size:13px}.xs{font-size:12px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.row{display:flex;gap:12px;align-items:center}.row.wrapf{flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:16px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#56cfc3);display:grid;place-items:center;font-size:15px}
.nav{display:flex;gap:4px}
.nav a{color:#c9d6ea;padding:8px 12px;border-radius:8px;font-weight:550;font-size:14px}
.nav a.on,.nav a:hover{color:#fff;background:rgba(255,255,255,.09)}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#c9d6ea;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:#fff;color:var(--navy)}
.seg.light{background:#eef1f6}.seg.light button{color:var(--ink-2)}.seg.light button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.iconbtn{position:relative;border:0;background:rgba(255,255,255,.08);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.iconbtn .cnt{position:absolute;top:-4px;right:-4px;background:var(--warm);color:#1b1205;font-size:11px;font-weight:800;border-radius:9px;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center}
.burger{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:650;font-size:14px;background:var(--accent);color:#fff;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#c3ccda;background:#fafbfd}
.btn.dark{background:var(--navy)}.btn.dark:hover{background:var(--navy-2)}
.btn.warn{background:var(--warm);color:#1b1205}
.btn.danger{background:#fff;color:var(--danger);border-color:#f2c5c5}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent-2);font-weight:600;padding:0}

/* hero */
.hero{background:radial-gradient(1200px 400px at 80% -10%,#1d4b7a 0,transparent 60%),linear-gradient(180deg,var(--navy),#0f2f55);color:#fff;padding:44px 0 80px}
.hero p.lead{color:#c9d6ea;font-size:17px;max-width:640px;margin:8px 0 22px}
.search{background:#fff;border-radius:16px;padding:8px;display:flex;gap:8px;box-shadow:var(--sh-lg);max-width:900px}
.search input,.search select{color:var(--ink)}
.search input{flex:1;border:0;outline:0;font-size:16px;padding:10px 12px;min-width:0}
.search select{border:0;border-left:1px solid var(--line);padding:0 12px;outline:0;background:#fff;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.chip.on,.chip:hover{background:#fff;color:var(--navy)}
.props{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:-46px;position:relative}
.prop{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start}
.prop .ic{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:18px}
.prop b{display:block;font-size:14px}.prop span{font-size:13px;color:var(--ink-3)}

/* catalog */
.layout{display:grid;grid-template-columns:270px 1fr;gap:24px;margin:28px auto 60px}
.filters{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;align-self:start;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.filters h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:16px 0 8px}
.filters h4:first-child{margin-top:0}
.ck{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px;cursor:pointer}
.ck input{accent-color:var(--accent);width:16px;height:16px}
.ck .n{margin-left:auto;color:var(--ink-3);font-size:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:#fff;outline:0;width:100%;transition:.12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.ferr{color:var(--danger);font-size:12px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:.18s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.card .media{aspect-ratio:16/10;position:relative;display:block}
.card .media svg{width:100%;height:100%;display:block}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16px;margin:0}
.card .spec{font-size:13px;color:var(--ink-3)}
.card .price{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.card .price .p{font-weight:800;font-size:19px}
.card .price .m{text-align:right;font-size:12px;color:var(--ink-3)}
.card .price .m b{display:block;color:var(--accent-2);font-size:16px}
.card .tools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.card .tools button{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card .tools button.on{background:var(--warm)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:#eef1f6;color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.acc{background:var(--accent-soft);color:var(--accent-2)}.badge.w{background:var(--warm-soft);color:#9a5410}.badge.d{background:var(--danger-soft);color:var(--danger)}.badge.i{background:var(--info-soft);color:#2456b8}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.mode{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink-2)}
.cond{position:absolute;left:10px;top:10px}
.empty{background:#fff;border-radius:var(--r);padding:40px;text-align:center;box-shadow:var(--sh)}

/* detail */
.crumbs{font-size:13px;color:var(--ink-3);margin:20px 0 10px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;margin-bottom:60px;align-items:start}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.panel+.panel{margin-top:18px}
.gallery .main{border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.gallery .main svg{width:100%;height:100%;display:block}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.thumbs button{border:2px solid transparent;border-radius:9px;overflow:hidden;padding:0;aspect-ratio:16/10;background:none}
.thumbs button.on{border-color:var(--accent)}
.thumbs svg{width:100%;height:100%;display:block}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spec-i{background:var(--bg);border-radius:10px;padding:10px 12px}
.spec-i span{display:block;font-size:12px;color:var(--ink-3)}.spec-i b{font-size:14px}
.feat{display:flex;flex-wrap:wrap;gap:8px}
.feat span{background:var(--accent-soft);color:var(--accent-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.trust>div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.trust i{font-style:normal;font-size:18px}
.cfg{position:sticky;top:80px}
.cfg .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.price-big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:#eef1f6;border-radius:11px;padding:4px;margin:12px 0 14px;flex-wrap:wrap}
.tabs button{flex:1 1 auto;border:0;background:transparent;border-radius:8px;padding:8px 8px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rng{margin:8px 0 14px}
.rng .top-l{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink-2)}
.rng .top-l b{color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-2)}
.result{background:linear-gradient(180deg,#f7fbfa,#eef8f6);border:1px solid #cfeae5;border-radius:12px;padding:14px 16px;margin:14px 0}
.result .big{font-size:30px;font-weight:800;color:var(--accent-2);letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:3px 0}
.kv span{color:var(--ink-2)}.kv b{font-weight:650;text-align:right}
.kv.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:15px}
.kv.tot b{font-weight:800}
details{border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-top:10px;background:#fff}
details summary{cursor:pointer;font-weight:650;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"▾";margin-left:auto;color:var(--ink-3)}
details[open] summary:after{content:"▴"}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin:16px 0 8px}
.line-ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f6;font-size:13.5px;cursor:pointer}
.line-ck:last-child{border-bottom:0}
.line-ck input{accent-color:var(--accent);width:17px;height:17px;flex:0 0 17px}
.line-ck .pr{margin-left:auto;font-weight:650;white-space:nowrap}
.line-ck small{display:block;color:var(--ink-3);font-size:12px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--info-soft);border-radius:9px;padding:8px 11px;margin:8px 0}
.note.w{background:var(--warm-soft);color:#7a420c}.note.ok{background:var(--ok-soft);color:#16693a}.note.d{background:var(--danger-soft);color:#962f2f}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:650;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid #f0f2f6;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr:hover td{background:#fafbfd}
.scroll{max-height:320px;overflow:auto}
.quote-card{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.12s}
.quote-card:hover{border-color:#b9c4d4}
.quote-card.on{border-color:var(--accent);background:var(--accent-soft)}
.quote-card .pp{margin-left:auto;text-align:right;font-weight:800;white-space:nowrap}

/* compare modal */
.modal-bg{position:fixed;inset:0;background:rgba(9,20,36,.55);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:16px;max-width:980px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:var(--sh-lg)}
.modal .x{float:right;border:0;background:#eef1f6;border-radius:9px;width:34px;height:34px;font-size:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cmp td,.cmp th{text-align:center!important}
.cmp td:first-child,.cmp th:first-child{text-align:left!important}
.best{color:var(--ok);font-weight:800}

/* checkout */
.steps{display:flex;gap:6px;margin:22px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-3);background:#fff;border-radius:10px;padding:10px 12px;box-shadow:var(--sh)}
.step .no{width:24px;height:24px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 24px}
.step.on{color:var(--ink)}.step.on .no{background:var(--accent);color:#fff}
.step.done .no{background:var(--ok);color:#fff}
.co{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;margin-bottom:60px;align-items:start}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.typecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tc{border:2px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;background:#fff;text-align:left}
.tc.on{border-color:var(--accent);background:var(--accent-soft)}
.tc b{display:block;margin:6px 0 2px}.tc span{font-size:12.5px;color:var(--ink-3)}
.kyc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.progress{list-style:none;padding:0;margin:10px 0}
.progress li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f6;font-size:14px}
.progress .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 26px;background:#eef1f6;font-size:13px}
.progress li.run .st{border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;background:#fff}
.progress li.ok .st{background:var(--ok);color:#fff}.progress li.bad .st{background:var(--danger);color:#fff}.progress li.wait .st{background:var(--warm);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.decision{border-radius:14px;padding:20px;margin:14px 0}
.decision.approved{background:var(--ok-soft)}.decision.conditional,.decision.manual{background:var(--warm-soft)}.decision.rejected{background:var(--danger-soft)}
.decision h2{margin-bottom:4px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:6px 0}
.consent input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 16px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px}
.doc .ic{font-size:20px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.timeline{border-left:3px solid var(--accent-soft);margin:10px 0 0 10px;padding-left:18px}
.timeline div{position:relative;padding:6px 0 12px}
.timeline div:before{content:"";position:absolute;left:-26px;top:9px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}

/* admin */
.admin{display:grid;grid-template-columns:230px 1fr;gap:22px;margin:24px auto 60px}
.side{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:10px;align-self:start;position:sticky;top:80px}
.side button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;color:var(--ink-2);font-size:14px}
.side button.on,.side button:hover{background:var(--accent-soft);color:var(--accent-2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:600}.kpi b{display:block;font-size:24px;margin-top:2px;letter-spacing:-.02em}
.mode-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.mode-box.off{background:#fafbfc}
.mode-box .mh{display:flex;align-items:center;gap:10px;font-weight:700}
.switch{position:relative;display:inline-block;width:40px;height:23px;flex:0 0 40px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd6e2;border-radius:23px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(17px)}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.f5{display:grid;grid-template-columns:repeat(5,1fr);gap:0 12px}
.st-pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-lg);z-index:100;font-weight:600;font-size:14px;animation:fade .2s}
.log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0d1b2e;color:#cfe3ff;border-radius:10px;padding:12px;max-height:420px;overflow:auto;white-space:pre-wrap}
footer{background:var(--navy);color:#9fb2cd;font-size:13px;padding:28px 0;margin-top:20px}
footer a{color:#cfe0f5}
footer .wrap>div:first-child{flex:1;min-width:280px}

@media (max-width:1100px){.detail,.co{grid-template-columns:1fr}.cfg{position:static}.props{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .layout,.admin{grid-template-columns:1fr}.filters,.side{position:static;max-height:none}
  .nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:10px}
  .nav.open{display:flex}.burger{display:grid}
  .specs{grid-template-columns:repeat(2,1fr)}.typecards,.kyc,.pay{grid-template-columns:1fr}

<body>
<div id="app"><div style="padding:80px 20px;text-align:center;font-family:system-ui;color:#6b7a90">Ładowanie platformy…</div></div>
<script>
/* ======== KONFIGURACJA WDROŻENIA ========
   apiBase: ''  -> tryb demonstracyjny (dane w przeglądarce, symulowane integracje)
   apiBase: 'https://api.mariusz-rogowski.pl' -> produkcja z backendem (server/server.js)
*/
window.AM_CONFIG = Object.assign({ apiBase: '', adminPin: 'admin' }, window.AM_CONFIG || {});
</script>
<script>/* ---- shared/calc.js ---- */
/*
 * AssetMarket – silnik kalkulacji ofert (wspólny dla frontu i backendu).
 * Wszystkie kwoty w PLN, zaokrąglane do groszy na końcu obliczeń.
 * Formy: purchase (zakup), str (najem krótkoterminowy), ltr (najem długoterminowy),
 *        lease_op (leasing operacyjny), lease_fin (leasing finansowy).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AMCalc = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  /** Stawka VAT jako ułamek. 'zw' i 'marza' => 0 (dla marży VAT jest w cenie, nie wykazywany). */
  function vatRate(code) {
    if (code === 'zw' || code === 'marza' || code === 'np') return 0;
    const n = Number(code);
    return isFinite(n) ? n / 100 : 0.23;
  }

  /** Cena brutto z netto */
  function grossFromNet(net, vatCode) { return r2(net * (1 + vatRate(vatCode))); }
  /** Cena netto z brutto */
  function netFromGross(gross, vatCode) { return r2(gross / (1 + vatRate(vatCode))); }

  /**
   * Rata annuitetowa płatna z dołu.
   * pv – kapitał do spłaty (dodatni), fv – wartość końcowa (wykup), i – stopa miesięczna.
   */
  function pmt(i, n, pv, fv) {
    fv = fv || 0;
    if (n <= 0) return 0;
    if (Math.abs(i) < 1e-12) return (pv - fv) / n;
    const q = Math.pow(1 + i, n);
    return (pv * q - fv) * i / (q - 1);
  }

  /** Harmonogram kapitał/odsetki dla leasingu */
  function schedule(i, n, pv, fv, installment) {
    const rows = [];
    let bal = pv;
    for (let k = 1; k <= n; k++) {
      const interest = bal * i;
      const capital = installment - interest;
      bal = bal - capital;
      rows.push({ no: k, installment: r2(installment), interest: r2(interest), capital: r2(capital), balance: r2(Math.max(bal, 0)) });
    }
    return rows;
  }

  /** Podstawa finansowania: dla VAT-marża / zw. leasingodawca finansuje cenę brutto (bez odliczenia VAT). */
  function financingBase(offer) {
    const v = offer.vat;
    if (v === 'marza' || v === 'zw') return Number(offer.priceGross || offer.priceNet);
    return Number(offer.priceNet);
  }

  /** Stawka VAT od opłat leasingowych/najmu – dla marży/zw. opłaty są i tak opodatkowane 23% */
  function serviceVatCode(offer) {
    return (offer.vat === 'marza' || offer.vat === 'zw') ? '23' : offer.vat;
  }

  // ------------------------------------------------------------------ ZAKUP
  function calcPurchase(offer, p) {
    const cfg = (offer.modes && offer.modes.purchase) || {};
    const discountPct = Number(cfg.discountPct || 0);
    const net = r2(Number(offer.priceNet) * (1 - discountPct / 100));
    const gross = offer.vat === 'marza' ? r2(Number(offer.priceGross) * (1 - discountPct / 100)) : grossFromNet(net, offer.vat);
    const vat = r2(gross - net);
    return {
      mode: 'purchase',
      net, vat, gross,
      discountPct,
      reservationFee: r2(Number(cfg.reservationFee || 0)),
      returnDays: Number(cfg.returnDays || 0),
      upfrontNet: net, upfrontGross: gross,
      monthlyNet: 0, monthlyGross: 0,
      lines: [
        { label: 'Cena netto', net, gross: null },
        { label: 'VAT ' + (offer.vat === 'marza' ? '(marża – nie wykazywany)' : offer.vat === 'zw' ? 'zw.' : offer.vat + '%'), net: vat },
        { label: 'Cena brutto', net: gross }
      ]
    };
  }

  // ------------------------------------------------------------------ NAJEM KRÓTKOTERMINOWY
  function calcShortRent(offer, p) {
    const cfg = (offer.modes && offer.modes.str) || {};
    const days = Math.max(Number(cfg.minDays || 1), Math.round(Number(p.days || cfg.minDays || 1)));
    const maxDays = Number(cfg.maxDays || 365);
    const d = Math.min(days, maxDays);
    let disc = 0;
    (cfg.tiers || []).forEach((t) => { if (d >= t.fromDays) disc = Math.max(disc, Number(t.discountPct)); });
    const dayNet = r2(Number(cfg.dayRateNet) * (1 - disc / 100));
    const rentNet = r2(dayNet * d);
    const vc = serviceVatCode(offer);
    const rentGross = grossFromNet(rentNet, vc);
    const deposit = r2(Number(cfg.deposit || 0));
    return {
      mode: 'str', days: d, discountPct: disc, dayNet, dayGross: grossFromNet(dayNet, vc),
      net: rentNet, vat: r2(rentGross - rentNet), gross: rentGross,
      deposit, kmPerDay: Number(cfg.kmPerDay || 0), kmLimit: Number(cfg.kmPerDay || 0) * d,
      extraKmNet: Number(cfg.extraKmNet || 0),
      upfrontNet: rentNet, upfrontGross: r2(rentGross + deposit),
      monthlyNet: 0, monthlyGross: 0
    };
  }

  // ------------------------------------------------------------------ LEASING
  function calcLease(offer, p, kind) {
    const cfg = (offer.modes && offer.modes[kind]) || {};
    const base = financingBase(offer);
    const term = clamp(Math.round(Number(p.term || cfg.terms && cfg.terms[0] || 36)), Number(cfg.minTerm || 12), Number(cfg.maxTerm || 84));
    const downPct = clamp(Number(p.downPct != null ? p.downPct : cfg.defaultDownPct || 10), Number(cfg.minDownPct || 0), Number(cfg.maxDownPct || 45));
    let rvMin = Number(cfg.minRvPct != null ? cfg.minRvPct : 1), rvMax = Number(cfg.maxRvPct != null ? cfg.maxRvPct : 40);
    const rvPct = clamp(Number(p.rvPct != null ? p.rvPct : cfg.defaultRvPct || rvMin), rvMin, rvMax);
    const annual = Number(cfg.ratePct || 9) / 100;
    const i = annual / 12;
    const feePct = Number(cfg.prepFeePct || 0);

    const down = r2(base * downPct / 100);
    const rv = r2(base * rvPct / 100);
    const fee = r2(base * feePct / 100);
    const financed = r2(base - down);
    const inst = pmt(i, term, financed, rv);
    const installmentNet = r2(inst);
    const vc = serviceVatCode(offer);
    const vr = vatRate(vc);
    const totalNet = r2(down + installmentNet * term + rv + fee);
    const res = {
      mode: kind, term, downPct, rvPct, ratePct: annual * 100, prepFeePct: feePct,
      base: r2(base), down, rv, fee, financed, installmentNet,
      totalNet, sumOfPaymentsPct: r2(totalNet / base * 100),
      schedule: schedule(i, term, financed, rv, inst)
    };
    if (kind === 'lease_op') {
      // VAT doliczany do każdej opłaty
      res.installmentGross = r2(installmentNet * (1 + vr));
      res.downGross = r2(down * (1 + vr));
      res.rvGross = r2(rv * (1 + vr));
      res.feeGross = r2(fee * (1 + vr));
      res.vatUpfront = 0;
      res.upfrontNet = r2(down + fee); res.upfrontGross = r2(res.downGross + res.feeGross);
      res.monthlyNet = installmentNet; res.monthlyGross = res.installmentGross;
      res.taxNote = 'Raty netto stanowią koszt uzyskania przychodu; VAT od każdej raty do odliczenia (dla aut osobowych wg limitów 50%/100%).';
    } else {
      // Leasing finansowy: VAT od całej wartości przedmiotu płatny z góry, raty bez VAT (część odsetkowa zw.)
      const vatUp = r2(base * vatRate(offer.vat === 'marza' || offer.vat === 'zw' ? '0' : offer.vat));
      res.vatUpfront = vatUp;
      res.installmentGross = installmentNet;
      res.downGross = down; res.rvGross = rv; res.feeGross = r2(fee * (1 + vr));
      res.upfrontNet = r2(down + fee); res.upfrontGross = r2(down + res.feeGross + vatUp);
      res.monthlyNet = installmentNet; res.monthlyGross = installmentNet;
      res.taxNote = 'Przedmiot w ewidencji korzystającego (amortyzacja); VAT od całej wartości płatny z pierwszą fakturą; w kosztach część odsetkowa rat.';
    }
    return res;
  }

  // ------------------------------------------------------------------ NAJEM DŁUGOTERMINOWY
  function calcLongRent(offer, p) {
    const cfg = (offer.modes && offer.modes.ltr) || {};
    const base = financingBase(offer);
    const term = clamp(Math.round(Number(p.term || (cfg.terms && cfg.terms[0]) || 36)), Number(cfg.minTerm || 12), Number(cfg.maxTerm || 60));
    const km = Number(p.kmYear || (cfg.kmOptions && cfg.kmOptions[0]) || 20000);
    const downPct = clamp(Number(p.downPct != null ? p.downPct : cfg.defaultDownPct || 0), 0, Number(cfg.maxDownPct || 30));
    // wartość rezydualna z tabeli (interpolacja liniowa po miesiącach) skorygowana o przebieg
    const tbl = (cfg.rvTable || [{ term: 24, rvPct: 62 }, { term: 36, rvPct: 52 }, { term: 48, rvPct: 43 }]).slice().sort((a, b) => a.term - b.term);
    let rvPct = tbl[0].rvPct;
    for (let k = 0; k < tbl.length; k++) {
      if (term >= tbl[k].term) rvPct = tbl[k].rvPct;
      if (k < tbl.length - 1 && term > tbl[k].term && term < tbl[k + 1].term) {
        const t = (term - tbl[k].term) / (tbl[k + 1].term - tbl[k].term);
        rvPct = tbl[k].rvPct + t * (tbl[k + 1].rvPct - tbl[k].rvPct);
      }
    }
    const refKm = Number(cfg.refKmYear || 20000);
    const pen = Number(cfg.rvPenaltyPer10k || 3);
    rvPct = clamp(rvPct - ((km - refKm) / 10000) * pen, 5, 85);
    const annual = Number(cfg.ratePct || 9.5) / 100;
    const i = annual / 12;
    const down = r2(base * downPct / 100);
    const rv = r2(base * rvPct / 100);
    const finance = r2(pmt(i, term, base - down, rv));
    const services = [];
    const sel = p.ltrServices || cfg.includedServices || [];
    const catalog = cfg.servicePrices || {};
    let svc = 0;
    Object.keys(catalog).forEach((k) => {
      const it = catalog[k];
      const mandatory = !!it.mandatory;
      if (mandatory || sel.indexOf(k) >= 0) {
        const kmFactor = it.perKm ? km / refKm : 1;
        const val = r2(Number(it.monthlyNet) * kmFactor);
        svc += val; services.push({ key: k, label: it.label, monthlyNet: val, mandatory });
      }
    });
    const monthlyNet = r2(finance + svc);
    const vc = serviceVatCode(offer);
    return {
      mode: 'ltr', term, kmYear: km, downPct, rvPct: r2(rvPct), ratePct: annual * 100,
      base: r2(base), down, rv, financeNet: finance, servicesNet: r2(svc), services,
      monthlyNet, monthlyGross: grossFromNet(monthlyNet, vc),
      upfrontNet: down, upfrontGross: grossFromNet(down, vc),
      totalNet: r2(down + monthlyNet * term),
      extraKmNet: Number(cfg.extraKmNet || 0.25),
      endOfTerm: 'Zwrot pojazdu (bez obowiązku wykupu); opcjonalnie odkup po wartości rynkowej.'
    };
  }

  // ------------------------------------------------------------------ UBEZPIECZENIE STATYCZNE
  /**
   * products: [{code,label,type:'pctValue'|'fixed', ratePct, fixed, appliesTo:['vehicle'|'asset']}]
   * opts: { selected:[codes], deductiblePct, inInstallment, months }
   */
  function calcStaticInsurance(offer, products, opts) {
    opts = opts || {};
    const value = Number(offer.priceGross || offer.priceNet);
    const isVehicle = offer.assetType === 'vehicle';
    const sel = opts.selected || [];
    const lines = [];
    let annual = 0;
    (products || []).forEach((pr) => {
      if (sel.indexOf(pr.code) < 0) return;
      if (pr.appliesTo && pr.appliesTo.indexOf(isVehicle ? 'vehicle' : 'asset') < 0) return;
      let prem = pr.type === 'pctValue' ? value * Number(pr.ratePct) / 100 : Number(pr.fixed);
      if (pr.deductibleSensitive && opts.deductiblePct) {
        prem = prem * (1 - Math.min(0.35, Number(opts.deductiblePct) * 0.035));
      }
      if (pr.oneOff) {
        // np. GAP – składka jednorazowa za cały okres; przeliczamy na rok dla porównania
        const years = Math.max(1, (opts.months || 36) / 12);
        prem = prem / years;
      }
      prem = r2(Math.max(prem, Number(pr.minPremium || 0)));
      annual += prem;
      lines.push({ code: pr.code, label: pr.label, annual: prem });
    });
    annual = r2(annual);
    return { annual, monthly: r2(annual / 12), lines, vat: 'zw', inInstallment: !!opts.inInstallment };
  }

  // ------------------------------------------------------------------ USŁUGI DODATKOWE
  function calcServices(services, selected) {
    let net = 0, gross = 0, monthlyNet = 0, monthlyGross = 0;
    const lines = [];
    (services || []).forEach((s) => {
      if ((selected || []).indexOf(s.code) < 0) return;
      const n = Number(s.priceNet);
      const g = grossFromNet(n, s.vat || '23');
      if (s.billing === 'monthly') { monthlyNet += n; monthlyGross += g; }
      else { net += n; gross += g; }
      lines.push({ code: s.code, label: s.label, net: r2(n), gross: g, billing: s.billing || 'oneoff' });
    });
    return { oneOffNet: r2(net), oneOffGross: r2(gross), monthlyNet: r2(monthlyNet), monthlyGross: r2(monthlyGross), lines };
  }

  /** Główna funkcja – zwraca kalkulację dla wybranej formy */
  function quote(offer, mode, params) {
    params = params || {};
    switch (mode) {
      case 'purchase': return calcPurchase(offer, params);
      case 'str': return calcShortRent(offer, params);
      case 'ltr': return calcLongRent(offer, params);
      case 'lease_op': return calcLease(offer, params, 'lease_op');
      case 'lease_fin': return calcLease(offer, params, 'lease_fin');
      default: throw new Error('Nieznana forma: ' + mode);
    }
  }

  /** Najniższa „rata od” do prezentacji na liście ofert */
  function fromMonthly(offer) {
    let best = null;
    ['lease_op', 'ltr', 'lease_fin'].forEach((m) => {
      if (!offer.modes || !offer.modes[m] || !offer.modes[m].enabled) return;
      const cfg = offer.modes[m];
      const q = quote(offer, m, { term: cfg.terms ? cfg.terms[cfg.terms.length - 1] : undefined, downPct: m === 'ltr' ? 0 : cfg.maxDownPct ? Math.min(20, cfg.maxDownPct) : 10, rvPct: cfg.defaultRvPct });
      if (best === null || q.monthlyNet < best.monthlyNet) best = { mode: m, monthlyNet: q.monthlyNet, monthlyGross: q.monthlyGross };
    });
    return best;
  }

  const MODE_LABELS = {
    purchase: 'Zakup', str: 'Najem krótkoterminowy', ltr: 'Najem długoterminowy',
    lease_op: 'Leasing operacyjny', lease_fin: 'Leasing finansowy'
  };

  return { r2, clamp, vatRate, grossFromNet, netFromGross, pmt, schedule, quote, calcStaticInsurance, calcServices, fromMonthly, MODE_LABELS };
});

/* ---- shared/validators.js ---- */
/* AssetMarket – walidatory danych klienta (PESEL, NIP, REGON, IBAN, kod pocztowy) */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AMValid = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const digits = (s) => String(s || '').replace(/[\s-]/g, '');

  function pesel(v) {
    const s = digits(v);
    if (!/^\d{11}$/.test(s)) return false;
    const w = [1, 3, 7, 9, 1, 3, 7, 9, 1, 3];
    let sum = 0;
    for (let i = 0; i < 10; i++) sum += w[i] * Number(s[i]);
    const c = (10 - (sum % 10)) % 10;
    if (c !== Number(s[10])) return false;
    return !!peselBirthDate(s);
  }

  function peselBirthDate(v) {
    const s = digits(v);
    let y = Number(s.slice(0, 2)), m = Number(s.slice(2, 4)), d = Number(s.slice(4, 6));
    let century = 1900;
    if (m > 80) { century = 1800; m -= 80; } else if (m > 60) { century = 2200; m -= 60; }
    else if (m > 40) { century = 2100; m -= 40; } else if (m > 20) { century = 2000; m -= 20; }
    const dt = new Date(Date.UTC(century + y, m - 1, d));
    if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt;
  }

  function ageFromPesel(v, now) {
    const b = peselBirthDate(v); if (!b) return null;
    now = now || new Date();
    let a = now.getUTCFullYear() - b.getUTCFullYear();
    const md = (now.getUTCMonth() - b.getUTCMonth()) || (now.getUTCDate() - b.getUTCDate());
    if (md < 0) a--;
    return a;
  }

  function nip(v) {
    const s = digits(v).replace(/^PL/i, '');
    if (!/^\d{10}$/.test(s)) return false;
    const w = [6, 5, 7, 2, 3, 4, 5, 6, 7];
    let sum = 0;
    for (let i = 0; i < 9; i++) sum += w[i] * Number(s[i]);
    const c = sum % 11;
    return c !== 10 && c === Number(s[9]);
  }

  function regon(v) {
    const s = digits(v);
    if (/^\d{9}$/.test(s)) {
      const w = [8, 9, 2, 3, 4, 5, 6, 7]; let sum = 0;
      for (let i = 0; i < 8; i++) sum += w[i] * Number(s[i]);
      return (sum % 11 % 10) === Number(s[8]);
    }
    if (/^\d{14}$/.test(s)) {
      const w = [2, 4, 8, 5, 0, 9, 7, 3, 6, 1, 2, 4, 8]; let sum = 0;
      for (let i = 0; i < 13; i++) sum += w[i] * Number(s[i]);
      return (sum % 11 % 10) === Number(s[13]);
    }
    return false;
  }

  function iban(v) {
    let s = String(v || '').replace(/\s/g, '').toUpperCase();
    if (/^\d{26}$/.test(s)) s = 'PL' + s;
    if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
    const r = s.slice(4) + s.slice(0, 4);
    let num = '';
    for (const ch of r) num += /[A-Z]/.test(ch) ? String(ch.charCodeAt(0) - 55) : ch;
    let mod = 0;
    for (let i = 0; i < num.length; i += 7) mod = Number(String(mod) + num.slice(i, i + 7)) % 97;
    return mod === 1;
  }

  const email = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || ''));
  const phone = (v) => /^(\+48)?\d{9}$/.test(digits(v));
  const postcode = (v) => /^\d{2}-\d{3}$/.test(String(v || '').trim());

  return { pesel, peselBirthDate, ageFromPesel, nip, regon, iban, email, phone, postcode, digits };
});

/* ---- shared/mock-services.js ---- */
/*
 * AssetMarket – symulatory usług zewnętrznych (tryb MOCK).
 * Te same funkcje wykorzystuje backend (adaptery w trybie mock) i front w trybie standalone.
 *
 * Scenariusze testowe (sterowane cyfrą seryjną PESEL – 10. cyfra / NIP – 9. cyfra):
 *   ...8.  -> weryfikacja tożsamości (KYC) negatywna
 *   ...9.  -> BIK negatywny (zaległości) -> odmowa
 *   ...7.  -> BIK średni -> decyzja warunkowa (wyższa opłata wstępna)
 *   inne   -> pozytywnie
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./validators.js'), require('./calc.js'));
  else root.AMMock = factory(root.AMValid, root.AMCalc);
})(typeof self !== 'undefined' ? self : this, function (V, C) {
  'use strict';

  const key = (applicant) => applicant.type === 'consumer' ? V.digits(applicant.pesel) : V.digits(applicant.nip);
  const scenarioDigit = (applicant) => {
    const k = key(applicant);

  };

  /** Rejestr przedsiębiorców (GUS BIR / CEIDG / KRS) */
  function registryLookup(nip) {
    if (!V.nip(nip)) return { ok: false, error: 'Nieprawidłowy NIP (suma kontrolna)' };
    const h = hash(V.digits(nip));
    const forms = ['jdg', 'spzoo', 'sa', 'spk'];
    const form = forms[h % 4];
    const names = ['Transbud', 'Agro-Pol', 'MedTech', 'Logistyka Plus', 'Inwest-Bau', 'Green Energy', 'Precyzja', 'NovaPrint'];
    const name = names[h % names.length] + (form === 'jdg' ? ' Jan Kowalski' : form === 'spzoo' ? ' Sp. z o.o.' : form === 'sa' ? ' S.A.' : ' Sp.k.');
    const months = 3 + (h % 180);
    const start = new Date(); start.setMonth(start.getMonth() - months);
    return {
      ok: true, source: form === 'jdg' ? 'CEIDG' : 'KRS / GUS BIR',
      nip: V.digits(nip), name, legalForm: form,
      regon: String(100000000 + (h % 899999999)).slice(0, 9),

    return `<footer><div class="wrap row wrapf"><div><b style="color:#fff">${esc(d.brand)}</b> · ${esc(d.tagline)}<br><span class="xs">Kalkulacje mają charakter informacyjny i nie stanowią oferty w rozumieniu art. 66 KC. Ostateczne warunki zależą od oceny wniosku. Tryb: ${S.data.mode === 'standalone' ? 'demonstracyjny (symulowane integracje)' : 'API'}.</span></div><span class="sp"></span><a href="#/jak-to-dziala">Jak to działa</a>&nbsp;·&nbsp;<a href="#/admin">Panel operatora</a></div></footer>`;
  }
  function page(active, inner) {
    $('#app').innerHTML = header(active) + `<main id="view">${inner}</main>` + footer();
  }

  // ------------------------------------------------------------------ katalog
  const BADGE = { history: ['Udokumentowana historia', 'ok'], inspection: ['Raport z inspekcji', 'i'], warranty: ['Gwarancja', 'acc'], firstOwner: ['1. właściciel', 'ok'], new: ['Nowy', 'acc'] };
  const fromCache = {};
  function fromM(o) { const k = o.id + JSON.stringify(o.modes) + o.priceNet; if (!(k in fromCache)) fromCache[k] = C.fromMonthly(o); return fromCache[k]; }

  function filtered() {
    const f = S.f, q = f.q.trim().toLowerCase();
    let list = S.data.offers.filter((o) => {
      if (S.route.query.ulubione && S.ui.fav.indexOf(o.id) < 0) return false;
      if (o.status === 'sold') return false;
      if (q && (o.title + ' ' + o.make + ' ' + o.model + ' ' + o.body + ' ' + o.location).toLowerCase().indexOf(q) < 0) return false;
      if (f.cat.length && f.cat.indexOf(o.category) < 0) return false;
      if (f.cond.length && f.cond.indexOf(o.condition) < 0) return false;
      if (f.mode.length && !f.mode.some((m) => o.modes[m] && o.modes[m].enabled)) return false;
      if (f.make.length && f.make.indexOf(o.make) < 0) return false;
      if (f.partner.length && f.partner.indexOf(o.partnerId) < 0) return false;
      if (f.fuel.length && f.fuel.indexOf(o.fuel) < 0) return false;
      if (f.maxPrice && priceOf(o) > Number(f.maxPrice)) return false;
      if (f.yearFrom && o.year < Number(f.yearFrom)) return false;
      if (f.maxMonthly) { const m = fromM(o); if (!m || (isB2B() ? m.monthlyNet : m.monthlyGross) > Number(f.maxMonthly)) return false; }
      return true;
    });
    const s = S.ui.sort;
    const mon = (o) => { const m = fromM(o); return m ? m.monthlyNet : 1e12; };
    if (s === 'priceAsc') list.sort((a, b) => a.priceNet - b.priceNet);
    else if (s === 'priceDesc') list.sort((a, b) => b.priceNet - a.priceNet);
    else if (s === 'monthly') list.sort((a, b) => mon(a) - mon(b));
    else if (s === 'year') list.sort((a, b) => b.year - a.year);
    return list;
  }

  function facet(key, label, values, labels) {
    const counts = {};
    S.data.offers.forEach((o) => { if (o.status === 'sold') return; const v = key === 'mode' ? null : o[key === 'cat' ? 'category' : key === 'cond' ? 'condition' : key === 'partner' ? 'partnerId' : key]; if (v != null) counts[v] = (counts[v] || 0) + 1; });
    if (key === 'mode') S.data.offers.forEach((o) => MODE_ORDER.forEach((m) => { if (o.status !== 'sold' && o.modes[m] && o.modes[m].enabled) counts[m] = (counts[m] || 0) + 1; }));
    return `<h4>${label}</h4>` + values.filter((v) => counts[v]).map((v) => `<label class="ck"><input type="checkbox" data-a="fck" data-k="${key}" value="${esc(v)}" ${S.f[key].indexOf(v) >= 0 ? 'checked' : ''}>${esc(labels ? labels[v] : v)}<span class="n">${counts[v]}</span></label>`).join('');
  }

    const m = fromM(o);
    const fav = S.ui.fav.indexOf(o.id) >= 0, cmp = S.ui.cmp.indexOf(o.id) >= 0;

    return `<article class="card" data-testid="card-${o.id}">
      <a class="media" href="#/oferta/${o.id}">${art(o)}<span class="cond badge ${o.condition === 'new' ? 'acc' : o.condition === 'exlease' ? 'w' : ''}">${esc(S.data.conditions[o.condition])}</span>${o.status === 'reserved' ? '<span class="badge d" style="position:absolute;left:10px;bottom:10px">Zarezerwowany</span>' : ''}</a>
      <div class="tools"><button data-a="fav" data-id="${o.id}" class="${fav ? 'on' : ''}" title="Ulubione" aria-label="Ulubione">♥</button><button data-a="cmp" data-id="${o.id}" class="${cmp ? 'on' : ''}" title="Porównaj" aria-label="Porównaj">⇄</button></div>
      <div class="body">
        <a href="#/oferta/${o.id}" style="color:inherit"><h3>${esc(o.title)}</h3></a>
        <div class="spec">${o.year} · ${num(o.mileage)} ${unit} · ${esc(o.fuel)} · ${esc(o.location)}</div>
        <div class="badges">${o.badges.slice(0, 3).map((b) => BADGE[b] ? `<span class="badge ${BADGE[b][1]}">${BADGE[b][0]}</span>` : '').join('')}</div>
        <div class="modes">${enabledModes(o).map((x) => `<span class="mode">${MODE_SHORT[x]}</span>`).join('')}</div>
        <div class="price"><div><div class="xs muted">Cena ${nettoLbl()}${o.vat === 'marza' ? ' (VAT-marża)' : ''}</div><div class="p">${zl(priceOf(o))}</div></div>
        ${m ? `<div class="m">rata od<b>${zl(isB2B() ? m.monthlyNet : m.monthlyGross)}</b>/mies. ${nettoLbl()}</div>` : ''}</div>
      </div></article>`;
  }

  function viewHome() {
    const d = S.data; const cats = d.categories;
    const makes = Array.from(new Set(d.offers.map((o) => o.make))).sort();
    const fuels = Array.from(new Set(d.offers.map((o) => o.fuel))).sort();
    const list = filtered();
    const plabels = {}; d.partners.forEach((p) => { plabels[p.id] = p.name; });
    const favMode = !!S.route.query.ulubione;
    page('home', `
    <section class="hero"><div class="wrap">
      <h1>${favMode ? 'Twoje ulubione oferty' : 'Pojazdy, maszyny i sprzęt – z finansowaniem w 15 minut'}</h1>
      <p class="lead">${esc(d.settings.tagline)}. Kup, wynajmij na doby lub lata, weź w leasing operacyjny albo finansowy – z ubezpieczeniem i serwisem w jednej racie.</p>
      <div class="search"><input id="q" placeholder="Marka, model, typ, np. „Octavia”, „koparka”, „USG”" value="${esc(S.f.q)}" data-a="q" aria-label="Szukaj">
        <select data-a="catsel" aria-label="Kategoria"><option value="">Wszystkie kategorie</option>${Object.keys(cats).map((k) => `<option value="${k}" ${S.f.cat.length === 1 && S.f.cat[0] === k ? 'selected' : ''}>${cats[k]}</option>`).join('')}</select>
        <button class="btn" data-a="go">Szukaj</button></div>
      <div class="chips">${MODE_ORDER.map((m) => `<button class="chip ${S.f.mode.indexOf(m) >= 0 ? 'on' : ''}" data-a="fck-chip" data-k="mode" data-v="${m}">${ML[m]}</button>`).join('')}</div>
    </div></section>
    <div class="wrap"><div class="props">
      <div class="prop"><div class="ic">⚡</div><div><b>Decyzja nawet w 15 min</b><span>Automatyczna ocena BIK i scoring wniosku</span></div></div>
      <div class="prop"><div class="ic">🖊</div><div><b>100% online</b><span>mObywatel, mojeID, e-podpis umowy</span></div></div>
      <div class="prop"><div class="ic">🛡</div><div><b>Ubezpieczenie w racie</b><span>Pakiet albo porównanie ofert agencji</span></div></div>
      <div class="prop"><div class="ic">↺</div><div><b>14 dni na zwrot</b><span>Dla wybranych aut używanych</span></div></div>
    </div>
    <div class="layout">
      <aside class="filters" aria-label="Filtry">
        <div class="seg light" style="width:100%;margin-bottom:10px"><button style="flex:1" data-a="client" data-v="b2b" class="${isB2B() ? 'on' : ''}">Firma (netto)</button><button style="flex:1" data-a="client" data-v="b2c" class="${!isB2B() ? 'on' : ''}">Konsument</button></div>
        ${facet('mode', 'Forma nabycia', MODE_ORDER, ML)}
        ${facet('cat', 'Kategoria', Object.keys(cats), cats)}
        ${facet('cond', 'Stan', ['new', 'used', 'exlease'], d.conditions)}
        <h4>Budżet (${nettoLbl()})</h4>
        <div class="field"><input class="inp" type="number" min="0" step="1000" placeholder="Cena maks. [zł]" value="${esc(S.f.maxPrice)}" data-a="fnum" data-k="maxPrice" aria-label="Cena maksymalna"></div>
        <div class="field"><input class="inp" type="number" min="0" step="100" placeholder="Rata maks. [zł/mies.]" value="${esc(S.f.maxMonthly)}" data-a="fnum" data-k="maxMonthly" aria-label="Rata maksymalna"></div>
        <div class="field"><input class="inp" type="number" min="1990" max="2030" placeholder="Rok produkcji od" value="${esc(S.f.yearFrom)}" data-a="fnum" data-k="yearFrom" aria-label="Rok od"></div>
        ${facet('make', 'Marka / producent', makes)}
        ${facet('fuel', 'Napęd / zasilanie', fuels)}
        ${facet('partner', 'Sprzedawca / partner', d.partners.map((p) => p.id), plabels)}
        <button class="btn ghost block" style="margin-top:12px" data-a="freset">Wyczyść filtry</button>
      </aside>
      <section>
        <div class="toolbar"><b data-testid="count">${list.length} ${list.length === 1 ? 'oferta' : list.length < 5 && list.length > 1 ? 'oferty' : 'ofert'}</b><span class="sp"></span>
          <label class="small muted" for="sort">Sortuj</label><select id="sort" class="inp" style="width:auto" data-a="sort">
          ${[['popular', 'Polecane'], ['monthly', 'Najniższa rata'], ['priceAsc', 'Cena rosnąco'], ['priceDesc', 'Cena malejąco'], ['year', 'Najnowsze roczniki']].map((x) => `<option value="${x[0]}" ${S.ui.sort === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>
        ${list.length ? `<div class="cards">${list.map(card).join('')}</div>` : `<div class="empty"><h3>Brak ofert spełniających kryteria</h3><p class="muted">Zmień filtry lub zapisz wyszukiwanie – poinformujemy Cię o nowych ofertach.</p><button class="btn" data-a="freset">Wyczyść filtry</button></div>`}
      </section>
    </div></div>`);
  }

  // ------------------------------------------------------------------ szczegóły oferty + konfigurator
  function cfgState(o) {
    if (!S.cfg[o.id]) {
      const modes = enabledModes(o);
      const pref = isB2B() ? ['lease_op', 'ltr', 'lease_fin', 'purchase', 'str'] : ['ltr', 'lease_op', 'purchase', 'lease_fin', 'str'];
      const mode = pref.find((m) => modes.indexOf(m) >= 0) || modes[0];
      const st = { mode, params: {}, ins: { type: 'static', selected: o.assetType === 'vehicle' ? ['OC', 'AC', 'NNW'] : ['ALLRISK'], deductiblePct: 0, inInstallment: true, dyn: { req: { driverAge: 40, postcode: '00-001', claimFreeYears: 5, usage: 'business', ac: true }, res: null, chosen: null, loading: false } }, svc: [], gal: 0 };
      st.ins.selected = st.ins.selected.filter((c) => o.insurance.static.indexOf(c) >= 0);
      resetParams(o, st);
      S.cfg[o.id] = st;
    }
    return S.cfg[o.id];
  }
  function resetParams(o, st) {
    const c = o.modes[st.mode] || {};
    const t = c.terms ? c.terms[Math.min(1, c.terms.length - 1)] : 36;
    if (st.mode === 'lease_op' || st.mode === 'lease_fin') st.params = { term: t, downPct: c.defaultDownPct, rvPct: c.defaultRvPct };
    else if (st.mode === 'ltr') st.params = { term: t, kmYear: (c.kmOptions || [20000])[1] || 20000, downPct: c.defaultDownPct || 0, ltrServices: (c.includedServices || []).slice() };
    else if (st.mode === 'str') { const dt = new Date(Date.now() + 864e5); st.params = { days: Math.max(c.minDays || 1, 3), start: dt.toISOString().slice(0, 10) }; }
    else st.params = { payOption: 'full' };
  }

  function totals(o, st) {
    const q = C.quote(o, st.mode, st.params);
    const fin = FIN.indexOf(st.mode) >= 0;
    let ins = null, insNote = null;
    if (st.mode === 'str') insNote = 'W cenie najmu: OC, AC z udziałem własnym (kaucja), assistance.';
    else if (st.mode === 'ltr' && q.services.some((s) => s.key === 'ins')) insNote = 'Ubezpieczenie OC/AC/NNW jest wliczone w ratę najmu (stała składka przez cały okres).';
    else if (st.ins.type === 'static') {
      const prods = S.data.insuranceProducts.filter((p) => o.insurance.static.indexOf(p.code) >= 0);
      const r = C.calcStaticInsurance(o, prods, { selected: st.ins.selected, deductiblePct: st.ins.deductiblePct, months: q.term || 36 });
      if (r.annual > 0) ins = { kind: 'static', annual: r.annual, monthly: r.monthly, lines: r.lines };
    } else if (st.ins.type === 'dynamic' && st.ins.dyn.chosen) {
      const ch = st.ins.dyn.chosen;
      ins = { kind: 'dynamic', annual: ch.annualPremium, monthly: ch.monthly, lines: ch.covers.map((c) => ({ label: c.label, annual: c.premium })), insurer: ch.insurer.name, quoteId: ch.quoteId };
    }
    const inInst = !!(fin && st.ins.inInstallment && ins);
    const svcAllowed = S.data.services.filter((s) => o.services.indexOf(s.code) >= 0 && s.appliesTo.indexOf(o.assetType) >= 0);
    const sv = C.calcServices(svcAllowed, st.svc);
    const r2 = C.r2;
    let upNet = q.upfrontNet + sv.oneOffNet + (ins && !inInst ? ins.annual : 0);
    let upGross = q.upfrontGross + sv.oneOffGross + (ins && !inInst ? ins.annual : 0);
    let payNow = upGross;
    if (st.mode === 'purchase' && st.params.payOption === 'reservation') payNow = q.reservationFee;
    return {
      q, ins, insNote, inInst, sv, fin,
      monthlyNet: r2(q.monthlyNet + sv.monthlyNet + (inInst ? ins.monthly : 0)),
      monthlyGross: r2(q.monthlyGross + sv.monthlyGross + (inInst ? ins.monthly : 0)),
      upNet: r2(upNet), upGross: r2(upGross), payNow: r2(payNow)
    };
  }

  function viewDetail(id) {
    const o = offerById(id);
    if (!o) return page('home', `<div class="wrap"><div class="empty" style="margin:40px 0"><h2>Oferta niedostępna</h2><a class="btn" href="#/">Wróć do ofert</a></div></div>`);

    const p = partner(o.partnerId);
    const unit = o.mileageUnit === 'mth' ? 'mth' : 'km';
    const specs = [['Rok produkcji', o.year], [o.mileageUnit === 'mth' ? 'Motogodziny' : 'Przebieg', num(o.mileage) + ' ' + unit], ['Napęd / zasilanie', o.fuel], ['Moc / parametry', o.power], ['Typ', o.body], ['Skrzynia', o.gearbox || '—'], ['Kolor', o.color], ['Lokalizacja', o.location], ['Stan', S.data.conditions[o.condition]]];
    page('home', `<div class="wrap">
      <div class="crumbs"><a href="#/">Oferta</a> › ${esc(S.data.categories[o.category])} › ${esc(o.make)}</div>
      <div class="detail">
        <div>
          <div class="panel">
            <div class="row wrapf" style="margin-bottom:12px"><div><h1 style="font-size:28px;margin:0">${esc(o.title)}</h1><div class="muted small">${esc(p.name)} · ${esc(p.type)} · ${esc(o.location)} · ID: ${esc(o.id)}</div></div><span class="sp"></span>
            <button class="btn ghost sm" data-a="fav" data-id="${o.id}">${S.ui.fav.indexOf(o.id) >= 0 ? '♥ W ulubionych' : '♡ Ulubione'}</button><button class="btn ghost sm" data-a="cmp" data-id="${o.id}">⇄ ${S.ui.cmp.indexOf(o.id) >= 0 ? 'W porównaniu' : 'Porównaj'}</button></div>
            <div class="gallery"><div class="main" id="gmain">${art(o, st.gal)}</div><div class="thumbs">${[0, 1, 2, 3].map((v) => `<button data-a="gal" data-v="${v}" class="${st.gal === v ? 'on' : ''}" aria-label="Zdjęcie ${v + 1}">${art(o, v)}</button>`).join('')}</div></div>
          </div>
          <div class="panel"><h3>Parametry</h3><div class="specs">${specs.map((s) => `<div class="spec-i"><span>${s[0]}</span><b>${esc(s[1])}</b></div>`).join('')}</div>
            <h3 style="margin-top:18px">Wyposażenie i cechy</h3><div class="feat">${o.features.map((f) => `<span>${esc(f)}</span>`).join('')}</div>
            <h3 style="margin-top:18px">Opis</h3><p>${esc(o.description)}</p></div>
          <div class="panel"><h3>Bezpieczny zakup</h3><div class="trust">
            <div><i>📋</i><div><b>Historia i dokumenty</b><br><span class="muted">${o.badges.indexOf('history') >= 0 ? 'Udokumentowana historia serwisowa i szkodowa' : 'Dokumentacja zakupu (faktura VAT' + (o.vat === 'marza' ? ' marża' : '') + ')'}</span></div></div>
            <div><i>🔎</i><div><b>Inspekcja techniczna</b><br><span class="muted">${o.badges.indexOf('inspection') >= 0 ? 'Raport niezależnego rzeczoznawcy dostępny' : 'Możesz zamówić niezależną inspekcję jako usługę'}</span></div></div>
            <div><i>↺</i><div><b>Prawo zwrotu</b><br><span class="muted">${o.modes.purchase.enabled && o.modes.purchase.returnDays ? o.modes.purchase.returnDays + ' dni na zwrot przy zakupie online' : 'Zgodnie z regulaminem (umowy B2B)'}</span></div></div>
            <div><i>🚚</i><div><b>Dostawa i rejestracja</b><br><span class="muted">Dostawa pod adres, rejestracja i tablice jako usługa</span></div></div>
          </div></div>
        </div>
        <aside class="cfg" id="cfg" aria-label="Konfigurator oferty">${cfgHtml(o, st)}</aside>
      </div></div>`);
  }

  function rng(label, key, min, max, step, val, fmtv) {
    return `<div class="rng"><div class="top-l"><span>${label}</span><b id="rv-${key}">${fmtv(val)}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-a="prm" data-k="${key}" aria-label="${label}"></div>`;
  }

  function cfgHtml(o, st) {
    const modes = enabledModes(o);
    const c = o.modes[st.mode];
    const pr = st.params;
    let ctl = '';
    if (st.mode === 'lease_op' || st.mode === 'lease_fin') {
      const base = (o.vat === 'marza' || o.vat === 'zw') ? o.priceGross : o.priceNet;
      ctl = `<div class="lbl">Okres umowy</div><div class="opts" style="margin:6px 0 10px">${c.terms.map((t) => `<button class="opt ${pr.term === t ? 'on' : ''}" data-a="prmopt" data-k="term" data-v="${t}">${t} mies.</button>`).join('')}</div>
      ${rng('Opłata wstępna', 'downPct', c.minDownPct, c.maxDownPct, 1, pr.downPct, (v) => v + '% · ' + zl(base * v / 100))}
      ${rng('Wartość wykupu', 'rvPct', c.minRvPct, c.maxRvPct, 1, pr.rvPct, (v) => v + '% · ' + zl(base * v / 100))}
      <div class="note">${st.mode === 'lease_op' ? 'Leasing operacyjny: raty netto w kosztach, VAT doliczany do każdej raty. Po zakończeniu wykup za ustaloną kwotę lub zwrot.' : 'Leasing finansowy: przedmiot w Twojej ewidencji (amortyzacja), VAT od całej wartości płatny z pierwszą fakturą, raty bez VAT.'}</div>`;
    } else if (st.mode === 'ltr') {
      ctl = `<div class="lbl">Okres najmu</div><div class="opts" style="margin:6px 0 10px">${c.terms.map((t) => `<button class="opt ${pr.term === t ? 'on' : ''}" data-a="prmopt" data-k="term" data-v="${t}">${t} mies.</button>`).join('')}</div>
      <div class="lbl">Roczny limit ${o.mileageUnit === 'mth' ? 'motogodzin (przeliczenie)' : 'kilometrów'}</div><div class="opts" style="margin:6px 0 10px">${c.kmOptions.map((t) => `<button class="opt ${pr.kmYear === t ? 'on' : ''}" data-a="prmopt" data-k="kmYear" data-v="${t}">${num(t)}</button>`).join('')}</div>
      ${rng('Opłata wstępna', 'downPct', 0, c.maxDownPct, 1, pr.downPct, (v) => v + '%')}
      <div class="sec-t">Usługi w racie najmu</div>${Object.keys(c.servicePrices).map((k) => { const s = c.servicePrices[k]; const on = s.mandatory || pr.ltrServices.indexOf(k) >= 0; return `<label class="line-ck"><input type="checkbox" data-a="ltrsvc" value="${k}" ${on ? 'checked' : ''} ${s.mandatory ? 'disabled' : ''}><span>${esc(s.label)}${s.mandatory ? '<small>w standardzie</small>' : ''}</span><span class="pr">${zl(s.monthlyNet)}/m</span></label>`; }).join('')}
      <div class="note">Najem długoterminowy: bez wykupu, stała rata z usługami. Nadprzebieg rozliczany wg stawki ${zl2(c.extraKmNet || 0.25)}/km netto.</div>`;
    } else if (st.mode === 'str') {
      const end = new Date(new Date(pr.start).getTime() + pr.days * 864e5).toISOString().slice(0, 10);
      ctl = `<div class="f2"><div class="field"><label for="strStart">Odbiór</label><input id="strStart" class="inp" type="date" value="${esc(pr.start)}" data-a="prmdate" data-k="start"></div><div class="field"><label>Zwrot</label><input class="inp" type="date" value="${end}" disabled></div></div>
      ${rng('Liczba dób', 'days', c.minDays || 1, c.maxDays || 90, 1, pr.days, (v) => v + ' ' + (v === 1 ? 'doba' : v < 5 ? 'doby' : 'dób'))}
      <div class="note">Rabaty: ${(c.tiers || []).map((t) => 'od ' + t.fromDays + ' dób −' + t.discountPct + '%').join(', ') || 'brak'}. Kaucja (preautoryzacja karty) ${zl(c.deposit)}.${c.kmPerDay ? ' Limit ' + c.kmPerDay + ' km/dobę.' : ''}</div>`;
    } else {
      const pc = o.modes.purchase;

        if (prods.some((p) => p.deductibleSensitive)) insH += `<div class="field" style="margin-top:8px"><label for="ded">Udział własny w szkodzie</label><select id="ded" class="inp" data-a="insded">${[0, 2, 5, 10].map((v) => `<option value="${v}" ${st.ins.deductiblePct === v ? 'selected' : ''}>${v ? v + '% wartości szkody' : 'Bez udziału własnego'}</option>`).join('')}</select></div>`;
      } else if (st.ins.type === 'dynamic') {
        const rq = st.ins.dyn.req; const veh = o.assetType === 'vehicle';
        insH += `<div class="${veh ? 'f2' : ''}">${veh ? `<div class="field"><label for="dAge">Wiek głównego kierowcy</label><input id="dAge" class="inp" type="number" min="18" max="99" value="${rq.driverAge}" data-a="dynreq" data-k="driverAge"></div><div class="field"><label for="dCfy">Lata bezszkodowe</label><input id="dCfy" class="inp" type="number" min="0" max="40" value="${rq.claimFreeYears}" data-a="dynreq" data-k="claimFreeYears"></div>` : ''}
          <div class="field"><label for="dPc">Kod pocztowy ${veh ? 'zamieszkania / siedziby' : 'lokalizacji mienia'}</label><input id="dPc" class="inp" value="${esc(rq.postcode)}" data-a="dynreq" data-k="postcode" placeholder="00-001"></div>
          ${veh ? `<div class="field"><label for="dUse">Sposób użytkowania</label><select id="dUse" class="inp" data-a="dynreq" data-k="usage">${[['private', 'Prywatny'], ['business', 'Firmowy'], ['rental', 'Wynajem'], ['taxi', 'Taxi / przewóz osób']].map((x) => `<option value="${x[0]}" ${rq.usage === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></div>` : ''}</div>
          <button class="btn ghost block" data-a="dynquote" ${st.ins.dyn.loading ? 'disabled' : ''}>${st.ins.dyn.loading ? 'Odpytuję agencję ubezpieczeniową…' : '↻ Pobierz oferty od ubezpieczycieli'}</button>`;
        if (st.ins.dyn.res) insH += st.ins.dyn.res.quotes.map((q, i) => `<div class="quote-card ${st.ins.dyn.chosen && st.ins.dyn.chosen.quoteId === q.quoteId ? 'on' : ''}" data-a="dynpick" data-i="${i}" role="button" tabindex="0"><div><b>${esc(q.insurer.name)}</b> ${i === 0 ? '<span class="badge ok">Najtaniej</span>' : ''}<div class="xs muted">${q.covers.map((c) => esc(c.code)).join(' · ')} · ocena ${q.insurer.rating}/5 · ważna do ${q.validUntil}</div></div><div class="pp">${zl(q.annualPremium)}<div class="xs muted">/rok · ${zl(q.monthly)}/m</div></div></div>`).join('');
      } else insH += `<div class="note w">Wymagamy cesji praw z polisy AC na finansującego (dla leasingu i najmu). Polisę prześlesz w procesie online.</div>`;

    return `<div class="panel">

      </div></div>`;
  }

  function resHtml(o, st) {
    const t = totals(o, st); const q = t.q;

      if (st.mode !== 'ltr') {
        rows.push(['Rata leasingowa netto', zl2(q.installmentNet)], ['Rata leasingowa brutto', zl2(q.installmentGross)], ['Opłata wstępna (' + q.downPct + '%) netto', zl2(q.down)], ['Opłata przygotowawcza (' + q.prepFeePct + '%)', zl2(q.fee)], ['Wykup (' + q.rvPct + '%) netto', zl2(q.rv)]);
        if (q.vatUpfront) rows.push(['VAT płatny z góry (leasing fin.)', zl2(q.vatUpfront)]);
        rows.push(['Oprocentowanie (stałe)', nf2.format(q.ratePct) + '% rocznie'], ['Suma opłat', nf2.format(q.sumOfPaymentsPct) + '% wartości']);
      } else {
        rows.push(['Część finansowa netto', zl2(q.financeNet)], ['Usługi w racie netto', zl2(q.servicesNet)], ['Wartość końcowa (' + q.rvPct + '%) – ryzyko najemcy: brak', zl(q.rv)], ['Limit przebiegu', num(q.kmYear) + ' / rok']);
      }
    } else if (st.mode === 'str') {
      main = `<div class="xs muted">Koszt najmu ${nettoLbl()}</div><div class="big" data-testid="monthly">${zl2(net ? q.net : q.gross)}</div><div class="small muted">${q.days} dób × ${zl2(net ? q.dayNet : q.dayGross)}${q.discountPct ? ' (rabat ' + q.discountPct + '%)' : ''} + kaucja ${zl(q.deposit)}</div>`;
      rows.push(['Najem netto', zl2(q.net)], ['VAT', zl2(q.vat)], ['Najem brutto', zl2(q.gross)], ['Kaucja (zwrotna)', zl2(q.deposit)]);
      if (q.kmLimit) rows.push(['Limit km w okresie', num(q.kmLimit) + ' km'], ['Nadprzebieg', zl2(q.extraKmNet) + '/km netto']);
    } else {
      main = `<div class="xs muted">Do zapłaty ${st.params.payOption === 'reservation' ? 'teraz (rezerwacja)' : nettoLbl()}</div><div class="big" data-testid="monthly">${zl2(st.params.payOption === 'reservation' ? t.payNow : up)}</div>${st.params.payOption === 'reservation' ? `<div class="small muted">pozostała kwota ${zl(t.upGross - t.payNow)} w ciągu 7 dni</div>` : ''}`;
      rows.push(['Cena netto', zl2(q.net)], ['VAT ' + (o.vat === 'marza' ? '(marża)' : ''), zl2(q.vat)], ['Cena brutto', zl2(q.gross)]);
    }
    if (t.ins) rows.push(['Ubezpieczenie' + (t.ins.insurer ? ' (' + t.ins.insurer + ')' : '') + ' – rok', zl2(t.ins.annual) + (t.inInst ? ' (w racie)' : ' (jednorazowo)')]);
    if (t.sv.oneOffNet) rows.push(['Usługi jednorazowe ' + nettoLbl(), zl2(net ? t.sv.oneOffNet : t.sv.oneOffGross)]);
    if (t.sv.monthlyNet) rows.push(['Usługi abonamentowe ' + nettoLbl(), zl2(net ? t.sv.monthlyNet : t.sv.monthlyGross) + '/m']);
    let sched = '';
    if (q.schedule) sched = `<details><summary>Harmonogram spłat (${q.schedule.length} rat)</summary><div class="scroll"><table class="t"><thead><tr><th>Nr</th><th class="n">Rata netto</th><th class="n">Kapitał</th><th class="n">Odsetki</th><th class="n">Saldo</th></tr></thead><tbody>${q.schedule.map((r) => `<tr><td>${r.no}</td><td class="n">${nf2.format(r.installment)}</td><td class="n">${nf2.format(r.capital)}</td><td class="n">${nf2.format(r.interest)}</td><td class="n">${nf2.format(r.balance)}</td></tr>`).join('')}</tbody></table></div><p class="xs muted">${esc(q.taxNote)}</p></details>`;
    return `<div class="result">${main}</div><details><summary>Szczegóły kalkulacji</summary>${rows.map((r) => `<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<div class="kv tot"><span>Płatność na start ${nettoLbl()}</span><b>${zl2(st.params.payOption === 'reservation' ? t.payNow : up)}</b></div></details>${sched}`;

  const MODE_FACTS = {

    lease_op: { own: 'Po wykupie', vat: 'W racie', svc: 'Opcjonalnie', end: 'Wykup / zwrot', acc: 'Rata netto w kosztach' },
    lease_fin: { own: 'Po spłacie', vat: 'Z góry', svc: 'Opcjonalnie', end: 'Przeniesienie własności', acc: 'Amortyzacja + odsetki' }

  function compareModes(o) {
    const st = cfgState(o);
    const modes = enabledModes(o);
    const cols = modes.map((m) => { const s = clone(st); s.mode = m; resetParams(o, s); s.ins = st.ins; s.svc = st.svc; return { m, t: totals(o, s) }; });
    const net = isB2B();
    const val = (c, k) => { const t = c.t; if (k === 'mon') return t.fin ? (net ? t.monthlyNet : t.monthlyGross) : null; if (k === 'up') return net ? t.upNet : t.upGross; if (k === 'tot') { if (t.fin) return (net ? t.upNet : t.upGross) + (net ? t.monthlyNet : t.monthlyGross) * t.q.term + (c.m === 'lease_op' || c.m === 'lease_fin' ? (net ? t.q.rv : t.q.rvGross) : 0); if (c.m === 'str') return net ? t.q.net : t.q.gross; return net ? t.upNet : t.upGross; } };
    const best = (k) => { const v = cols.map((c) => val(c, k)).filter((x) => x != null); return Math.min.apply(null, v); };
    const cell = (c, k) => { const v = val(c, k); if (v == null) return '—'; return `<span class="${v === best(k) && k === 'mon' ? 'best' : ''}">${zl(v)}</span>`; };

      ${[['own', 'Własność'], ['vat', 'VAT'], ['svc', 'Serwis / ubezpieczenie'], ['end', 'Koniec umowy'], ['acc', 'Ujęcie księgowe']].map((r) => `<tr><td>${r[1]}</td>${cols.map((c) => `<td class="small">${MODE_FACTS[c.m][r[0]]}</td>`).join('')}</tr>`).join('')}
      <tr><td></td>${cols.map((c) => `<td><button class="btn sm" data-a="pickMode" data-v="${c.m}">Wybierz</button></td>`).join('')}</tr>
      </tbody></table></div>`);
  }

  function validateData() {
    const a = S.co.applicant, e = {}, fin = FIN.indexOf(S.co.mode) >= 0, company = a.type !== 'consumer';

    ['firstName', 'lastName', 'email', 'phone', 'street', 'postcode', 'city', 'pesel', 'idDoc'].forEach((k) => req(k));
    if (a.pesel && !V.pesel(a.pesel)) e.pesel = 'Nieprawidłowy numer PESEL';
    else if (a.pesel && V.ageFromPesel(a.pesel) < 18) e.pesel = 'Wymagana pełnoletność';
    if (a.email && !V.email(a.email)) e.email = 'Nieprawidłowy e-mail';
    if (a.phone && !V.phone(a.phone)) e.phone = 'Podaj 9 cyfr (opcjonalnie +48)';
    if (a.postcode && !V.postcode(a.postcode)) e.postcode = 'Format 00-000';
    if (a.idDoc && !/^[A-Z]{3}\s?\d{6}$/i.test(a.idDoc.trim())) e.idDoc = 'Format ABC123456';
    if (company) { req('nip'); req('companyName'); if (a.nip && !V.nip(a.nip)) e.nip = 'Nieprawidłowy NIP'; if (fin) req('annualRevenue'); }

    if (!cs.terms || !cs.rodo || (fin && !cs.bik)) e._consents = 'Zaznacz wymagane zgody (*)';

  async function runDecision() {
    const c = S.co; const a = applicantDto();
    const steps = [];
    const show = () => { c.progress = steps; if (stepKey() === 'dec') viewCheckout(); };
    try {
      if (a.type !== 'consumer') {
        steps.push({ label: 'Rejestry przedsiębiorców (GUS/CEIDG/KRS, Biała lista VAT)', st: 'run' }); show();
        if (!c.registry) c.registry = await api('registry.lookup', { nip: a.nip });
        steps[0].st = c.registry.ok ? 'ok' : 'bad'; steps[0].info = c.registry.ok ? esc(c.registry.name) + ' · ' + c.registry.monthsActive + ' mies. działalności' : esc(c.registry.error);
        if (!c.registry.ok) { show(); return; }
      }
      const bi = steps.push({ label: a.type === 'consumer' ? 'Biuro Informacji Kredytowej (BIK) + BIG' : 'BIK Przedsiębiorcy + BIG (KRD/ERIF)', st: 'run' }) - 1; show();
      c.credit = await api('bik.check', { applicant: a });
      steps[bi].st = c.credit.status === 'negative' ? 'bad' : c.credit.status === 'medium' ? 'wait' : 'ok';
      steps[bi].info = 'Scoring ' + c.credit.score + '/' + c.credit.scoreMax + ' · zobowiązania aktywne: ' + c.credit.activeCredits + ' · zaległości: ' + c.credit.overdueAccounts;
      const si = steps.push({ label: 'Scoring i decyzja finansującego', st: 'run' }) - 1; show();
      c.decision = await api('leasing.decide', { applicant: a, credit: c.credit, registry: c.registry, offerId: c.offerId, mode: c.mode, params: c.params });
      steps[si].st = c.decision.decision === 'approved' ? 'ok' : c.decision.decision === 'rejected' ? 'bad' : 'wait';
      steps[si].info = esc(c.decision.reasons.join('; '));
      await saveOrder({ approved: 'approved', conditional: 'conditional', manual: 'manual', rejected: 'rejected' }[c.decision.decision] === 'manual' ? 'manual_review' : c.decision.decision);
    } catch (e) { steps.push({ label: 'Błąd usługi: ' + e.message, st: 'bad' }); }
    show();
  }
